<script>
/* ══════════════════════════════════════════════════════════════════════
   js-app — ตรรกะแอพมือถือหน้างาน
   ══════════════════════════════════════════════════════════════════ */

var S = {
  screen: 'login',
  pin: '', pinErr: '', remember: store.get('remember', true),
  stage: 'id',            // 'id' = ใส่รหัสพนักงาน · 'pin2' = ใส่รหัสลับ 3 หลัก
  pin2Id: '', pin2Name: '',
  user: null, isAdmin: false,
  topics: [], assets: [], shifts: [], issueTags: [], openJobs: [], today: '',
  busyCodes: {},          // { รหัสเครื่อง: {by,id,date,time} } เครื่องที่ยังไม่ได้คืน

  topic: null,            // หัวข้อที่กำลังทำ
  action: 'เบิก',
  ref: '',                // รหัสรายการเบิก ตอนกดคืน
  shift: '',
  forEmp: null,           // แอดมินเบิกแทนใคร (null = เบิกให้ตัวเอง)
  forPick: false,         // เปิดช่องเลือกคนอยู่ไหม
  staffList: [],          // รายชื่อให้แอดมินเลือก (เซิร์ฟเวอร์ส่งมาเฉพาะแอดมิน)
  picked: [],             // รหัสเครื่องที่เลือก
  issueCodes: [],         // เครื่องที่แจ้งว่าเสียในรอบนี้ (ตัวไหนบ้างจากที่ติ๊กมา)
  pickedExtra: [],        // อุปกรณ์เสริมที่เบิกพ่วง (เช่น เลเซอร์ลบ) — เป็นเครื่อง นับรวมในจำนวน
  qty: 1,
  step: 0,
  shots: {},              // { ชื่อช่อง: {dataUrl, time, gps} } — ช่องบังคับ ช่องละ 1 รูป
  extra: [],              // รูปแนบเพิ่ม [{id, dataUrl, time, gps, src}]
  issueShots: [],         // รูปจุดที่มีปัญหา — หลายรูปได้ เสียหลายเครื่องก็ถ่ายครบทุกเครื่อง
  result: '', issueText: '', note: '',
  busy: false, queueCount: 0,
  photoCount: 0,          // รูปที่ค้างส่ง (รายการปิดไปแล้ว แต่รูปยังไม่ถึงชีท)
  stale: false,           // ดึงข้อมูลใหม่จากเซิร์ฟเวอร์ไม่สำเร็จ = ของบนจอเป็นของเก่า

  // ทยอยอัปโหลดรูประหว่างที่ยังถ่ายอยู่ — ตอนกดส่งจะได้ไม่ต้องรออัปโหลดอีก
  job: null,          // { recordId, folderId, folderUrl } ที่จองไว้
  jobWait: null,      // คำขอจองที่กำลังวิ่งอยู่
  up: {},             // { รหัสรูป: แถวที่อัปเสร็จแล้ว }
  upBusy: {},         // { รหัสรูป: คำขอที่กำลังอัปอยู่ }
  upSeq: 0
};

var CAP = null; // เป้าหมายของรูปที่กำลังจะถ่าย

// ── ตัวช่วยจากสถานะ ───────────────────────────────────────────────────

function reqSlots()  { return S.topic ? S.topic.slots.filter(function (x) { return x.req && !x.onIssue; }) : []; }
function issueSlot() { return S.topic ? S.topic.slots.filter(function (x) { return x.onIssue; })[0] : null; }
function issueSlotName() { var s = issueSlot(); return s ? s.th : 'จุดที่มีปัญหา'; }
function rule(id)    { return !!(S.topic && S.topic.rules && S.topic.rules[id]); }

/**
 * เจ้าของรายการ — ปกติคือคนที่ล็อกอิน
 * ถ้าแอดมินเลือก "เบิกแทนคนอื่น" จะเป็นคนนั้นแทน (เขาต้องเป็นคนกดคืนเอง)
 */
function owner() { return S.forEmp || S.user; }

/** แถบ "เบิกให้ใคร" — เห็นเฉพาะแอดมินและเฉพาะตอนเบิก */
function renderForWho() {
  var on = canPickFor();
  $('#forwho-wrap').classList.toggle('hide', !on);
  if (!on) return;

  var other = !!S.forEmp || S.forPick;
  $('#forwho-self').classList.toggle('btn-primary', !other);
  $('#forwho-self').classList.toggle('btn-secondary', other);
  $('#forwho-other').classList.toggle('btn-primary', other);
  $('#forwho-other').classList.toggle('btn-secondary', !other);
  $('#forwho-pick').classList.toggle('hide', !other);
  if (!other) return;

  var q = ($('#forwho-q').value || '').trim().toLowerCase();
  var list = (S.staffList || []).filter(function (x) {
    if (x.id === S.user.id) return false;                    // ตัวเองใช้ปุ่ม "ตัวเอง"
    if (!q) return true;
    return (x.id + ' ' + x.name + ' ' + x.dept).toLowerCase().indexOf(q) >= 0;
  }).slice(0, 30);

  var box = $('#forwho-list'); box.innerHTML = '';
  if (!list.length) {
    box.appendChild(el('div', { style: 'font-size:12px;opacity:.7;padding:6px' }, ['ไม่พบพนักงานที่ตรงกับที่ค้นหา']));
    return;
  }
  list.forEach(function (x) {
    var pickedOne = S.forEmp && S.forEmp.id === x.id;
    var b = el('button', {
      class: 'btn ' + (pickedOne ? 'btn-primary' : 'btn-secondary'),
      style: 'text-align:left;justify-content:flex-start;font-size:12.5px;padding:8px 10px'
    }, [x.id + ' · ' + x.name + ' · ' + x.dept]);
    b.addEventListener('click', function () {
      S.forEmp = pickedOne ? null : x;
      if (S.forEmp) S.shift = x.shift || S.shift;   // ใช้กะของเจ้าของรายการ
      render();
    });
    box.appendChild(b);
  });
}

/** แอดมินเลือกคนให้ได้เฉพาะตอนเบิก ตอนคืนต้องเป็นเจ้าของรายการเท่านั้น */
function canPickFor() { return S.isAdmin && S.action === 'เบิก'; }

/** ประเภทอุปกรณ์เสริมที่เบิกพ่วงได้ — ตั้งจากชีท "เงื่อนไข" แถว extra (ว่าง = ไม่มี) */
function extraType() { return (S.topic && S.topic.extraType) || ''; }
function galleryMode() { return !!S.topic && (reqSlots().length === 0 || S.topic.countMode); }

/**
 * หัวข้อแบบนับจำนวน (เปิดเงื่อนไข count เช่น IDATA) ใช้หน้าแนบรูปอิสระเป็นขั้นแรก
 * แทนการบังคับถ่ายทีละจุด เพราะเบิกไปหลายเครื่องแล้วกระจายกันไปคนละที่
 * จะแนบกี่รูปก็ได้ ถ่ายสดหรืออัปโหลดก็ได้ ขอแค่ให้เห็นอุปกรณ์ครบ
 */
function steps() {
  var out = [];
  if (galleryMode()) out.push({ type: 'gallery' });
  else reqSlots().forEach(function (sl) { out.push({ type: 'cam', slot: sl }); });
  out.push({ type: 'status' });
  out.push({ type: 'note' });
  return out;
}

/** ต้องมีรูปอย่างน้อย 1 ใบไหม — ดูจากว่าชีทตั้งช่องถ่ายเป็น "บังคับ" ไว้หรือเปล่า */
function needsGalleryPhoto() { return reqSlots().length > 0; }

/** ชื่อช่องที่จะใช้บันทึกรูปจากหน้าแนบรูป (ลงชีท "รูปภาพ" ในชื่อนี้) */
function gallerySlotName() {
  var r = reqSlots();
  return r.length ? r[0].th : 'รูปอุปกรณ์';
}
function curStep() { var a = steps(); return a[Math.min(S.step, a.length - 1)] || null; }

/**
 * รหัสที่เบิกทั้งหมด = เครื่องหลัก + อุปกรณ์เสริม
 * เลเซอร์ลบก็คือเครื่องไอดาต้าเหมือนกัน แค่แยกรายการไว้เพราะทุกแผนกเบิกเสริมได้
 * เพราะฉะนั้นหน่วยเป็น "เครื่อง" และต้องนับรวมเป็นจำนวนเดียวกัน
 */
function pickedAll() { return S.picked.concat(S.pickedExtra); }
function totalQty()  { return S.picked.length + S.pickedExtra.length; }

function codesText() {
  var all = pickedAll();
  if (all.length) return all.join(', ');
  if (S.topic && S.topic.countMode) return S.topic.name + ' ' + S.qty + ' เครื่อง';
  return '—';
}

function shotCount() {
  return reqSlots().filter(function (sl) { return S.shots[sl.th]; }).length;
}

function issueOk() {
  if (S.result !== 'มีปัญหา') return true;
  if (!S.issueText.trim()) return false;
  // เบิกหลายตัวต้องบอกว่าตัวไหนเสีย ไม่งั้นจดใส่เครื่องไม่ได้ว่าใครพัง
  if (pickedAll().length > 1 && !S.issueCodes.length) return false;
  if (rule('issue') && !S.issueShots.length) return false;
  return true;
}
function readyToSend() {
  if (galleryMode()) { if (needsGalleryPhoto() && !S.extra.length) return false; }
  else if (shotCount() !== reqSlots().length) return false;
  if (!S.result) return false;
  if (!issueOk()) return false;
  if (rule('gps') && !geo.text()) return false;
  return true;
}

// ── การนำทาง ──────────────────────────────────────────────────────────

function go(screen) {
  if (screen !== 'shoot') stopCam();   // ออกจากหน้าถ่ายรูปแล้วปิดกล้อง ไม่ให้กินแบต
  S.screen = screen; render();
  window.scrollTo(0, 0); $('#body').scrollTop = 0;
}

function resetJob() {
  S.topic = null; S.action = 'เบิก'; S.ref = ''; S.borrowedQty = 0;
  S.forEmp = null; S.forPick = false;
  S.picked = []; S.pickedExtra = []; S.issueCodes = []; S.qty = 1;
  S.step = 0; S.shots = {}; S.extra = []; S.issueShots = [];
  S.result = ''; S.issueText = ''; S.note = '';
  S.job = null; S.jobWait = null; S.up = {}; S.upBusy = {}; S.upSeq = 0;
}

function openTopic(t) {
  resetJob();
  S.topic = t;
  S.shift = S.user.shift;
  go('form');
}

function startReturn(job) {
  var t = S.topics.filter(function (x) { return x.name === job.topic; })[0] || S.topics[0];
  resetJob();
  S.topic = t;
  S.action = 'คืน';
  S.ref = job.id;
  // รหัสที่เบิกไปเก็บรวมกันในชีทช่องเดียว ตอนคืนต้องแยกกลับมาว่าตัวไหนเป็นอุปกรณ์เสริม
  // จะได้ติ๊กค้างไว้ถูกกล่อง
  var all = job.codes ? job.codes.split(/\s*,\s*/).filter(Boolean) : [];
  var isExtra = {};
  if (t.extraType) {
    S.assets.forEach(function (a) { if (a.type === t.extraType) isExtra[a.code] = true; });
  }
  S.picked      = all.filter(function (c) { return !isExtra[c]; });
  S.pickedExtra = all.filter(function (c) { return  isExtra[c]; });
  S.qty = job.qty || all.length || 1;
  S.borrowedQty = job.qty || all.length || 0;   // ไว้เทียบว่าคืนครบไหม
  S.shift = S.user.shift;

  // ตอนเบิกแจ้งปัญหาไว้ ก็ติ๊ก "มีปัญหา" ค้างไว้ให้เลย พร้อมเติมอาการเดิม
  // เปลี่ยนเป็นปกติได้ตลอดถ้าซ่อมแล้วหรือแจ้งผิด — แค่เลือกไว้ให้ ไม่ได้ล็อก
  var bad = knownDefects();
  if (bad.length) {
    S.result = 'มีปัญหา';
    S.issueCodes = bad.map(function (k) { return k.code; });
    // ตัดส่วนที่ระบบต่อท้ายไว้ (วันที่/ผู้แจ้ง) ออก เหลือแต่ตัวอาการ
    S.issueText = bad.map(function (k) { return k.defect.split(' · แจ้ง ')[0]; })
      .filter(function (x, i, a) { return a.indexOf(x) === i; }).join(' · ');
  }
  // แวะหน้าข้อมูลงานก่อน เพื่อให้แก้จำนวนที่คืนจริงได้ (เบิก 10 คืน 8 ก็มี)
  go('form');
}

function back() {
  if (S.screen === 'login' && pin2Stage()) { backToId(); return; }
  if (S.screen === 'shoot' && S.step > 0) { S.step--; render(); return; }
  if (S.screen === 'shoot') { go('form'); return; }
  if (S.screen === 'review') { S.step = steps().length - 1; go('shoot'); return; }
  if (S.screen === 'form') { go('home'); return; }
  go('home');
}

// ══════════════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════════════

var TITLES = {
  login: ['เข้าสู่ระบบ', 'SIGN IN'], home: ['อัพเดทงาน', 'HOME'],
  form: ['ข้อมูลงาน', 'JOB INFO'], shoot: ['ถ่ายรูป', 'CAPTURE'],
  review: ['ตรวจทาน', 'REVIEW'], done: ['ส่งแล้ว', 'SUBMITTED'], queue: ['คิวรอส่ง', 'QUEUE']
};

function render() {
  $$('[data-screen]').forEach(function (n) {
    n.classList.toggle('hide', n.getAttribute('data-screen') !== S.screen);
  });

  var t = TITLES[S.screen] || ['', ''];
  $('#head-title').textContent = S.screen === 'shoot' ? shootTitle() : t[0];
  $('#head-sub').textContent = S.screen === 'shoot' ? (S.step + 1) + '/' + steps().length : t[1];
  $('#btn-back').classList.toggle('hide', S.screen === 'home' || S.screen === 'login');

  $('#bar-l').textContent = navigator.onLine ? '5G' : 'ไม่มีสัญญาณ';
  $('#bar-r').textContent = geo.text() ? 'GPS ' + geo.text() : 'ยังไม่มีพิกัด';
  $('#app-ver').textContent = appVersion();

  if (S.screen === 'login')  renderLogin();
  if (S.screen === 'home')   renderHome();
  if (S.screen === 'form')   renderForm();
  if (S.screen === 'shoot')  renderShoot();
  if (S.screen === 'review') renderReview();
  if (S.screen === 'queue')  renderQueue();

  renderFooter();
}

function shootTitle() {
  var st = curStep();
  if (!st) return 'ถ่ายรูป';
  if (st.type === 'cam')     return 'ถ่าย: ' + st.slot.th;
  if (st.type === 'gallery') return needsGalleryPhoto() ? 'ถ่าย/แนบรูปอุปกรณ์' : 'แนบรูปเพิ่มเติม';
  if (st.type === 'status')  return 'สถานะการใช้งาน';
  return 'ข้อมูลเพิ่มเติม';
}

// ── หน้าล็อกอิน ───────────────────────────────────────────────────────

// รหัสพนักงานในชีทมีทั้ง 5 และ 6 หลัก
var PIN_MIN = 5, PIN_MAX = 6;
var PIN2_LEN = 3;              // รหัสลับเพิ่มเติมของบัญชีที่ตั้งไว้ในชีท

/** ขั้นรหัสลับ = บัญชีที่ตั้งรหัส 3 หลักไว้ในชีท ต้องใส่เพิ่มก่อนเข้า */
function pin2Stage() { return S.stage === 'pin2'; }
function pinLen() { return pin2Stage() ? PIN2_LEN : PIN_MAX; }

function renderLogin() {
  var p2 = pin2Stage(), n = pinLen();

  $('#login-title').textContent = p2 ? 'ใส่รหัสลับ 3 หลัก' : 'ใส่รหัสพนักงาน';
  $('#login-sub').textContent = p2
    ? (S.pin2Name || 'บัญชีนี้') + ' — บัญชีนี้ตั้งรหัสลับไว้ ต้องใส่ก่อนเข้าใช้งาน'
    : 'ระบบดึงชื่อ แผนก และกะการทำงานจากชีททะเบียนพนักงานให้อัตโนมัติ';

  var wrap = $('#pin-boxes'); wrap.innerHTML = '';
  for (var i = 0; i < n; i++) {
    wrap.appendChild(el('div', {
      class: 'pinbox' + (S.pin[i] ? ' f' : '') + (S.pin.length === i ? ' c' : ''),
      // ช่องที่ 6 จางไว้ เพราะรหัสพนักงานบางคนมีแค่ 5 หลัก
      style: (!p2 && i >= PIN_MIN && !S.pin[i]) ? 'opacity:.45' : ''
    }, [p2 && S.pin[i] ? '•' : (S.pin[i] || '')]));
  }
  $('#pin-err').textContent = S.pinErr;

  var kp = $('#keypad');
  if (!kp.childNodes.length) {
    ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function (k) {
      var b = el('button', { class: 'key', style: k ? '' : 'visibility:hidden' }, [k]);
      b.addEventListener('click', function () {
        if (!k) return;
        if (k === '⌫') S.pin = S.pin.slice(0, -1); else S.pin = (S.pin + k).slice(0, pinLen());
        S.pinErr = ''; render();
      });
      kp.appendChild(b);
    });
  }

  // ขั้นรหัสลับไม่ต้องมีปุ่มจำการเข้าสู่ระบบและรหัสทดลอง
  $('#remember').classList.toggle('hide', p2);
  var dw = $('#demo-wrap'); if (dw) dw.classList.toggle('hide', p2);

  $('#remember').style.borderColor = S.remember ? 'var(--color-accent)' : 'var(--color-divider)';
  var box = $('#remember-box');
  box.style.background = S.remember ? 'var(--color-accent)' : 'transparent';
  box.style.borderColor = S.remember ? 'var(--color-accent)' : 'var(--color-divider)';
  box.textContent = S.remember ? '✓' : '';
}

// ── หน้าหลัก ──────────────────────────────────────────────────────────

function renderHome() {
  var u = S.user;
  $('#u-init').textContent = u.name.slice(0, 2);
  $('#u-name').textContent = u.name;
  $('#u-meta').textContent = u.id + ' · ' + u.role + ' · ' + u.dept;
  $('#u-shift').textContent = u.shift;
  $('#admin-note').classList.toggle('hide', !S.isAdmin);
  // เสิร์ฟจาก GitHub Pages จะมี ADMIN_URL ให้ ไม่งั้นต่อท้าย URL ของ Apps Script เอง
  $('#admin-link').href = window.ADMIN_URL || (WEBAPP_URL + '?page=admin');
  $('#today-label').textContent = 'วันนี้ · ' + S.today;
  $('#open-count').textContent = 'ค้างคืน ' + S.openJobs.length + ' รายการ';
  renderHomeWarn();

  var list = $('#open-list'); list.innerHTML = '';
  $('#open-wrap').classList.toggle('hide', !S.openJobs.length);
  S.openJobs.forEach(function (j) {
    var b = el('button', { class: 'btn btn-primary', style: 'padding:9px 16px;font-size:13px' }, ['คืน']);
    b.addEventListener('click', function () { startReturn(j); });
    list.appendChild(el('div', {
      style: 'display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-divider)'
    }, [
      el('div', { style: 'flex:1;line-height:1.35' }, [
        el('div', { style: 'font-family:var(--font-heading);font-weight:800;font-size:14px' }, [j.codes || j.id]),
        el('div', { style: 'font-size:11px;opacity:.65' }, [
          'เบิกเมื่อ ' + (j.time || '—') + ' น. · ' + j.topic + (j.empName !== S.user.name ? ' · ' + j.empName : '')
        ])
      ]), b
    ]));
  });
  if (!S.openJobs.length) {
    list.appendChild(el('div', { class: 'surface', style: 'padding:10px;font-size:12px' }, ['ไม่มีรายการค้างคืน']));
    $('#open-wrap').classList.remove('hide');
  }

  var tl = $('#topic-list'); tl.innerHTML = '';
  S.topics.forEach(function (t) {
    var card = el('button', { class: 'topiccard' }, [
      el('div', { style: 'display:flex;align-items:flex-start;gap:12px;width:100%' }, [
        el('div', {
          style: 'width:44px;height:44px;flex:none;background:var(--color-text);color:var(--color-bg);' +
                 'display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px'
        }, [t.abbr]),
        el('div', { style: 'flex:1;text-align:left;line-height:1.35' }, [
          el('div', { style: 'font-family:var(--font-heading);font-weight:800;font-size:16px' }, [t.name]),
          el('div', { style: 'font-size:12px;opacity:.7' }, [t.desc])
        ]),
        el('div', {
          style: 'font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;' +
                 'background:var(--color-accent);color:var(--color-bg);white-space:nowrap'
        }, ['พร้อมใช้'])
      ])
    ]);
    card.addEventListener('click', function () { openTopic(t); });
    tl.appendChild(card);
  });
  if (!S.topics.length) {
    tl.appendChild(el('div', { class: 'surface', style: 'padding:12px;font-size:12px' },
      ['ยังไม่มีหัวข้อที่เปิดใช้งาน — แอดมินเปิดได้ที่ชีท "หัวข้อสำรวจ"']));
  }

  $('#queue-badge').textContent = S.queueCount + S.photoCount;
}

/**
 * แถบเตือนบนหน้าหลัก
 *
 * สองเรื่องที่พนักงานต้องรู้ก่อนเริ่มงานใหม่ และของเดิมไม่เคยบอกเลย:
 *   · ยังมีงานที่กดส่งไปแล้วแต่ยังไม่ถึงชีท (ค้างอยู่ในเครื่องตัวเอง)
 *   · รายการค้างคืนบนจอเป็นของเก่า เพราะดึงข้อมูลใหม่ไม่สำเร็จ
 */
function renderHomeWarn() {
  var box = $('#home-warn');
  if (!box) return;
  var msg = [];
  if (S.queueCount) {
    msg.push('⚠ ยังมี ' + S.queueCount + ' รายการที่ยังไม่ถึงชีท — กด "คิวรอส่ง" ด้านล่างเพื่อส่งให้จบ');
  }
  if (S.photoCount) {
    // รายการปิดไปแล้ว งานไม่ติด แต่หลักฐานยังขาด — ต้องทวงให้เห็นชัด
    msg.push('🔴 คุณมีรูปค้างส่ง ' + S.photoCount + ' ใบ (ถ่ายไว้แล้ว ไม่ต้องถ่ายใหม่) — กด "คิวรอส่ง" แล้วกดส่งให้จบ');
  }
  if (S.stale) {
    msg.push('⚠ ข้อมูลบนหน้านี้เป็นของเก่า (ดึงข้อมูลใหม่ไม่สำเร็จ) รายการค้างคืนอาจไม่ตรงกับความจริง');
  }
  box.innerHTML = msg.map(esc).join('<br>');
  box.classList.toggle('hide', !msg.length);
}

// ── หน้าข้อมูลงาน ─────────────────────────────────────────────────────

function renderForm() {
  var t = S.topic, u = owner();
  $('#form-top').innerHTML = S.action === 'คืน'
    ? '<strong>คืน ' + esc(t.name) + '</strong> — เบิกไป ' + (S.borrowedQty || '?') +
      ' เครื่อง (' + esc(S.ref) + ')<br>ถ้าคืนไม่ครบ แก้จำนวนด้านล่างให้ตรงกับที่คืนจริง'
    : (S.forEmp
        ? '<strong style="color:var(--color-accent)">กำลังเบิกให้ ' + esc(S.forEmp.name) + '</strong>' +
          '<br>รายการจะเป็นของเขา และเขาต้องเป็นคนกดคืนเอง'
        : '<strong>' + esc(t.name) + '</strong> — ข้อมูลจะถูกส่งเข้าชีทอัตโนมัติ');

  renderForWho();

  var info = [
    ['วันที่', S.today], ['กะการทำงาน', S.shift], ['ผู้เบิก', u.name],
    ['รหัสพนักงาน', u.id], ['แผนก', u.dept], ['สถานะใช้งาน', S.action]
  ];
  if (S.forEmp) info.push(['บันทึกโดย', S.user.name]);
  var ai = $('#auto-info'); ai.innerHTML = '';
  info.forEach(function (kv) {
    ai.appendChild(el('div', {
      style: 'padding:5px 10px;font-size:11.5px;display:flex;gap:6px;' +
             'border-top:1px solid color-mix(in srgb,var(--color-text) 12%,transparent)'
    }, [
      el('span', { style: 'opacity:.55' }, [kv[0]]),
      el('strong', { style: 'margin-left:auto;text-align:right' }, [kv[1]])
    ]));
  });

  // เลือกกะได้เฉพาะแอดมิน
  $('#shift-wrap').classList.toggle('hide', !S.isAdmin);

  if (S.isAdmin) {
    var sc = $('#shift-chips'); sc.innerHTML = '';
    S.shifts.forEach(function (sh) {
      var b = el('button', { class: 'chip' + (sh === S.shift ? ' on' : '') },
        [sh.replace('กะ ', '').replace(' น.', '')]);
      b.addEventListener('click', function () { S.shift = sh; render(); });
      sc.appendChild(b);
    });
  }

  // จำนวนเครื่องมีที่เดียว คือนับจากรหัสที่ติ๊ก รวมอุปกรณ์เสริมด้วย
  S.qty = totalQty();

  // รหัสเครื่องจากทะเบียน กรองตามประเภทของหัวข้อ + แผนกของผู้ใช้
  var pool = S.assets.filter(function (a) {
    return a.status === 'พร้อมใช้' && (a.type === t.assetType || a.type === t.name);
  });
  // ปกติเห็นเฉพาะเครื่องของแผนกตัวเอง ยกเว้น 3 กรณีนี้ให้เห็นทุกแผนก:
  //   แอดมิน/หัวหน้างาน · คนที่แผนกเป็น "ทุกแผนก" · แผนกที่ระบุไว้ในชีท (เงื่อนไข alldept)
  var seeAll = S.isAdmin
    || S.user.role === 'หัวหน้างาน'
    || S.user.dept === 'ทุกแผนก'
    || (t.allDepts || []).indexOf(S.user.dept) >= 0;

  // เครื่องที่ตั้งแผนกไว้ว่า "ทุกแผนก" คือของกลาง ทุกคนต้องเห็นเสมอ
  var mine = pool.filter(function (a) {
    return a.dept === owner().dept || a.dept === 'ทุกแผนก';
  });
  var list = seeAll ? pool : (mine.length ? mine : pool);

  if (S.action === 'คืน') {
    // ตอนคืน ต้องเห็นเครื่องที่เบิกไปครบทุกตัวและติ๊กไว้ให้แล้ว
    // แม้ทะเบียนจะเปลี่ยนสถานะหรือย้ายแผนกไปแล้วก็ตาม จะได้แค่ติ๊กออกถ้าคืนไม่ครบ
    var have = {};
    list.forEach(function (a) { have[a.code] = true; });
    var missing = S.picked.filter(function (c) { return !have[c]; })
      .map(function (c) { return { code: c, type: t.assetType, dept: S.user.dept, status: 'พร้อมใช้' }; });
    var isPicked = function (a) { return S.picked.indexOf(a.code) >= 0; };
    list = missing.concat(list.filter(isPicked)).concat(list.filter(function (a) { return !isPicked(a); }));
  }

  $('#codes-label').textContent = S.action === 'คืน'
    ? 'รหัสเครื่องที่คืน (ติ๊กออกถ้าคืนไม่ครบ)'
    : 'รหัสเครื่องที่เบิก (ติ๊กได้หลายตัว จำนวนนับให้เอง)';
  var cw = $('#code-chips'); cw.innerHTML = '';
  var nBusy = 0;
  list.forEach(function (a) {
    var on = S.picked.indexOf(a.code) >= 0;
    // เครื่องที่ค้างอาการอยู่ ติดดาวไว้เฉย ๆ ยังเบิกได้ปกติ รายละเอียดอยู่หน้าเลือกสถานะ
    var b = el('button', { class: 'chip' + (on ? ' on' : '') }, [a.code + (a.defect ? ' ⚠' : '')]);
    if (a.defect) b.title = a.defect;
    cw.appendChild(b);

    // เครื่องที่คนอื่นเบิกไปแล้วยังไม่คืน กดไม่ได้ จะได้ไม่เสียเวลาถ่ายรูปฟรี
    // แล้วมาโดนปฏิเสธตอนกดส่ง (ฝั่งชีทก็กันซ้ำอีกชั้นตอนเขียนจริง)
    var busy = (S.action === 'เบิก' && !on) ? S.busyCodes[a.code] : null;
    if (busy) {
      nBusy++;
      b.className = 'chip';
      b.style.opacity = '.4';
      b.style.textDecoration = 'line-through';
      b.title = busy.by + ' เบิกไปเมื่อ ' + busy.date + ' ' + busy.time + ' น. ยังไม่คืน';
      b.addEventListener('click', function () {
        toast(a.code + ' — ' + busy.by + ' เบิกไปเมื่อ ' + busy.date + ' ' + busy.time + ' น. ยังไม่คืน');
      });
      return;
    }

    b.addEventListener('click', function () {
      S.picked = on ? S.picked.filter(function (c) { return c !== a.code; }) : S.picked.concat([a.code]);
      S.qty = totalQty();
      render();
    });
  });
  if (!list.length) {
    cw.appendChild(el('div', { style: 'font-size:12px;opacity:.7' },
      ['ไม่มีเครื่องสถานะ "พร้อมใช้" ในทะเบียนสำหรับหัวข้อนี้']));
  } else if (nBusy) {
    cw.appendChild(el('div', { style: 'width:100%;font-size:11.5px;opacity:.7;margin-top:2px' },
      ['ตัวที่จาง ๆ ขีดฆ่า = คนอื่นเบิกไปแล้วยังไม่คืน ' + nBusy + ' เครื่อง (กดดูว่าใครเบิก)']));
  }
  $('#codes-count').textContent = S.picked.length + ' เครื่อง';

  // ── อุปกรณ์เสริม (เช่น เลเซอร์ลบ) — ขึ้นให้ทุกแผนก ไม่บังคับเบิก ──
  var xt = extraType();
  // หัวข้อไหนไม่มีอุปกรณ์เสริม ตัวเลขในกล่องนี้คือยอดรวมอยู่แล้ว เลยโชว์ตัวใหญ่เลย
  // ถ้ามีอุปกรณ์เสริม ตัวนี้เป็นแค่ยอดย่อย ตัวใหญ่ไปอยู่ที่ยอดรวมด้านล่าง
  $('#codes-count').style.cssText = xt
    ? 'font-size:12px'
    : 'font-family:var(--font-heading);font-weight:800;font-size:22px';
  $('#extra-wrap').classList.toggle('hide', !xt);
  if (xt) {
    $('#extra-label').textContent = xt + ' (ไม่บังคับ — เบิกกี่เครื่องก็ได้)';
    var pool = S.assets.filter(function (a) { return a.type === xt && a.status === 'พร้อมใช้'; });
    var xw = $('#extra-chips'); xw.innerHTML = '';
    pool.forEach(function (a) {
      var on = S.pickedExtra.indexOf(a.code) >= 0;
      var b = el('button', { class: 'chip' + (on ? ' on' : '') }, [a.code]);
      xw.appendChild(b);

      // เลเซอร์ลบก็เป็นเครื่อง กันเบิกซ้ำเหมือนกัน
      var busy = (S.action === 'เบิก' && !on) ? S.busyCodes[a.code] : null;
      if (busy) {
        b.className = 'chip';
        b.style.opacity = '.4';
        b.style.textDecoration = 'line-through';
        b.title = busy.by + ' เบิกไปเมื่อ ' + busy.date + ' ' + busy.time + ' น. ยังไม่คืน';
        b.addEventListener('click', function () {
          toast(a.code + ' — ' + busy.by + ' เบิกไปเมื่อ ' + busy.date + ' ' + busy.time + ' น. ยังไม่คืน');
        });
        return;
      }

      b.addEventListener('click', function () {
        S.pickedExtra = on ? S.pickedExtra.filter(function (c) { return c !== a.code; })
                           : S.pickedExtra.concat([a.code]);
        render();
      });
    });
    if (!pool.length) {
      xw.appendChild(el('div', { style: 'font-size:12px;opacity:.7' },
        ['ไม่มี' + xt + 'สถานะ "พร้อมใช้" ในทะเบียน']));
    }
    $('#extra-count').textContent = S.pickedExtra.length + ' เครื่อง';
  }

  // ยอดรวมตัวใหญ่ — เครื่องหลัก + อุปกรณ์เสริม เป็นจำนวนเดียวที่ส่งเข้าชีท
  // มีอุปกรณ์เสริมค่อยขึ้น ไม่งั้นจะซ้ำกับตัวเลขของกล่องรหัสเครื่องเปล่า ๆ
  $('#total-wrap').classList.toggle('hide', !xt);
  $('#total-label').textContent = S.action === 'คืน' ? 'จำนวนเครื่องที่คืน' : 'จำนวนเครื่องที่เบิก';
  $('#total-count').textContent = totalQty() + ' เครื่อง';
}

// ── หน้าถ่ายรูป ───────────────────────────────────────────────────────

function renderShoot() {
  var all = steps(), st = curStep();

  var pg = $('#progress'); pg.innerHTML = '';
  all.forEach(function (_, i) {
    pg.appendChild(el('div', {
      style: 'height:4px;flex:1;background:' + (i <= S.step ? 'var(--color-accent)' : 'var(--color-divider)')
    }));
  });

  ['cam', 'gallery', 'status', 'note'].forEach(function (k) {
    $('#step-' + k).classList.toggle('hide', !st || st.type !== k);
  });

  if (st.type === 'cam')     renderCamStep(st.slot);
  if (st.type === 'gallery') renderGalleryStep();
  if (st.type === 'status')  renderStatusStep();
  if (st.type === 'note')    renderNoteStep();
}

function stampNow() {
  var n = nowParts();
  return { date: n.date, time: n.time, gps: geo.text() };
}

function renderCamStep(slot) {
  var shot = S.shots[slot.th];
  var cam = $('#cam');
  $$('img', cam).forEach(function (n) { n.remove(); });
  if (shot) cam.appendChild(el('img', { src: shot.dataUrl, alt: slot.th }));

  if (!shot) startCam();                       // เปิดกล้องในหน้าเว็บทันทีที่เข้าจุดถ่าย
  var live = !!camStream && !shot;
  $('#cam-video').classList.toggle('hide', !live);
  cam.classList.toggle('empty', !shot && !live);
  $('#cam-placeholder').classList.toggle('hide', !!shot || live);
  $('#cam-placeholder').innerHTML = camBusy
    ? 'กำลังเปิดกล้อง…<br><span style="font-size:11px;opacity:.7">กด "อนุญาต" เมื่อระบบถาม</span>'
    : (camFailed
        ? 'ใช้กล้องในหน้าเว็บไม่ได้<br><span style="font-size:11px;opacity:.7">กดถ่ายรูปเพื่อเปิดแอพกล้องของเครื่องแทน</span>'
        : 'กรอบกล้อง<br><span style="font-size:11px;opacity:.7">เวลาและพิกัดล็อกจากระบบ แก้ไม่ได้</span>');

  var n = nowParts();
  $('#cam-stamp').textContent = shot
    ? (shot.date + ' ' + shot.time + (shot.gps ? ' · GPS ' + shot.gps : ''))
    : (n.date + ' ' + n.time + (geo.text() ? ' · GPS ' + geo.text() : ' · ยังไม่มีพิกัด'));

  $('#cam-hint').textContent = slot.hint || ('ถ่ายให้เห็น ' + slot.th + ' ชัดเจน');
  $('#btn-shoot').textContent = shot ? 'ถ่ายแล้ว — ไปต่อ' : 'ถ่าย ' + slot.th;
  $('#btn-retake').classList.toggle('hide', !shot);

  // เลือกรูปจากคลังภาพแทนการถ่ายสดก็ได้ ถ้าหัวข้อนั้นไม่ได้บังคับถ่ายสด (เงื่อนไข live)
  // รูปที่อัปโหลดโดนประทับวันเวลา/พิกัด/รหัสเครื่องเหมือนกันทุกใบ ไม่มีทางเลี่ยง
  $('#btn-cam-up').classList.toggle('hide', !!shot || rule('live'));

  var pips = $('#pips'); pips.innerHTML = '';
  reqSlots().forEach(function (sl, i) {
    var on = !!S.shots[sl.th];
    var b = el('button', {
      style: 'flex:1;height:30px;font-size:12px;cursor:pointer;font-family:var(--font-heading);font-weight:800;' +
             'border:1px solid ' + (i === S.step ? 'var(--color-text)' : 'var(--color-divider)') + ';' +
             'background:' + (on ? 'var(--color-accent)' : 'transparent') + ';' +
             'color:' + (on ? 'var(--color-bg)' : 'var(--color-text)')
    }, [String(i + 1)]);
    b.addEventListener('click', function () { S.step = i; render(); });
    pips.appendChild(b);
  });
}

function renderGalleryStep() {
  var n = nowParts();
  var req = reqSlots();
  var head = rule('live')
    ? 'หัวข้อนี้บังคับถ่ายสดจากกล้อง — เลือกจากคลังภาพไม่ได้'
    : 'ถ่ายสดหรืออัปโหลดจากคลังภาพก็ได้ ผสมกันได้ จะกี่รูปก็ได้'
      + (needsGalleryPhoto() ? ' (อย่างน้อย 1 รูป)' : ' — ไม่บังคับ');

  // รายการที่ต้องถ่ายให้เห็น มาจากชีท "ช่องถ่ายรูป" ของหัวข้อนี้
  var list = req.map(function (sl) {
    return '<div style="display:flex;gap:6px;margin-top:4px">'
      + '<span style="color:var(--color-accent)">•</span><span><strong>' + esc(sl.th) + '</strong>'
      + (sl.hint ? ' — ' + esc(sl.hint) : '') + '</span></div>';
  }).join('');

  $('#gal-hint').innerHTML = esc(head)
    + (list ? '<div style="margin-top:8px;border-top:1px solid var(--color-divider);padding-top:6px">'
              + '<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6">ต้องเห็นให้ครบ</div>'
              + list + '</div>' : '');
  $('#gal-stamp').textContent = (geo.text() ? 'GPS ' + geo.text() + ' · ' : '') + n.date + ' ' + n.time;
  $('#btn-gal-up').classList.toggle('hide', rule('live'));
  $('#gal-count').textContent = 'แนบแล้ว ' + S.extra.length + ' รูป';
  $('#btn-gal-clear').classList.toggle('hide', !S.extra.length);

  var g = $('#gal-grid'); g.innerHTML = '';
  S.extra.forEach(function (p) {
    var x = el('button', { class: 'x' }, ['✕']);
    x.addEventListener('click', function () {
      S.extra = S.extra.filter(function (y) { return y.id !== p.id; }); render();
    });
    g.appendChild(el('div', { class: 'cell' }, [
      el('img', { src: p.dataUrl }),
      el('div', { class: 'bd' }, [(p.src === 'cam' ? 'ถ่าย' : 'อัปโหลด') + ' ' + p.time]),
      x
    ]));
  });
}

/** อาการค้างของเครื่องที่กำลังเบิก/คืนอยู่ — [{code, defect}] */
function knownDefects() {
  var by = {};
  (S.assets || []).forEach(function (a) { if (a.defect) by[a.code] = a.defect; });
  return pickedAll().filter(function (c) { return by[c]; })
    .map(function (c) { return { code: c, defect: by[c] }; });
}

function renderStatusStep() {
  $('#st-ok').classList.toggle('on', S.result === 'ปกติ');
  $('#st-issue').classList.toggle('on', S.result === 'มีปัญหา');
  $('#issue-wrap').classList.toggle('hide', S.result !== 'มีปัญหา');

  // ── กล่องบอกอาการที่เคยแจ้งไว้ ไม่ขวาง ไม่บังคับอะไร ──
  var known = knownDefects();
  $('#known-wrap').classList.toggle('hide', !known.length);
  if (known.length) {
    $('#known-head').textContent = 'เครื่องที่เคยแจ้งปัญหาไว้ ' + known.length + ' เครื่อง';
    var kl = $('#known-list'); kl.innerHTML = '';
    known.forEach(function (k) {
      kl.appendChild(el('div', {}, [
        el('strong', {}, [k.code + ': ']),
        el('span', { style: 'opacity:.85' }, [k.defect])
      ]));
    });
  }

  // ── เลือกว่าเครื่องไหนเสีย — เบิกตัวเดียวติ๊กให้เลย ไม่ต้องกดเพิ่ม ──
  var all = pickedAll();
  S.issueCodes = S.issueCodes.filter(function (c) { return all.indexOf(c) >= 0; });
  if (all.length === 1 && !S.issueCodes.length) S.issueCodes = all.slice();

  $('#issue-which-wrap').classList.toggle('hide', all.length < 2);
  if (all.length >= 2) {
    $('#issue-which-label').textContent =
      'เครื่องไหนที่มีปัญหา (เลือกได้หลายตัว · เลือกแล้ว ' + S.issueCodes.length + ')';
    var w = $('#issue-which'); w.innerHTML = '';
    all.forEach(function (c) {
      var on = S.issueCodes.indexOf(c) >= 0;
      var b = el('button', { class: 'chip' + (on ? ' on' : '') }, [c]);
      b.addEventListener('click', function () {
        S.issueCodes = on ? S.issueCodes.filter(function (x) { return x !== c; })
                          : S.issueCodes.concat([c]);
        render();
      });
      w.appendChild(b);
    });
  }

  // อาการที่พบบ่อย — ใช้ของหัวข้อนั้นก่อน (ชีท "เงื่อนไข" แถว tags) ไม่มีค่อยใช้ชุดกลาง
  var tagList = (S.topic && S.topic.issueTags && S.topic.issueTags.length)
    ? S.topic.issueTags : S.issueTags;
  var tags = $('#issue-tags'); tags.innerHTML = '';
  tagList.forEach(function (x) {
    var b = el('button', { class: 'chip' + (S.issueText === x ? ' on' : '') }, [x]);
    b.addEventListener('click', function () { S.issueText = x; $('#issue-text').value = x; render(); });
    tags.appendChild(b);
  });
  if ($('#issue-text').value !== S.issueText) $('#issue-text').value = S.issueText;

  $('#issue-photo-wrap').classList.toggle('hide', !rule('issue'));
  $('#issue-photo-label').textContent = 'รูป' + issueSlotName() + ' (บังคับอย่างน้อย 1 รูป)';
  $('#issue-count').textContent = 'แนบแล้ว ' + S.issueShots.length + ' รูป';
  $('#btn-issue-clear').classList.toggle('hide', !S.issueShots.length);

  var g = $('#issue-grid'); g.innerHTML = '';
  S.issueShots.forEach(function (p) {
    var x = el('button', { class: 'x' }, ['✕']);
    x.addEventListener('click', function () {
      S.issueShots = S.issueShots.filter(function (y) { return y.id !== p.id; });
      render();
    });
    g.appendChild(el('div', { class: 'cell' }, [
      el('img', { src: p.dataUrl }),
      el('div', { class: 'bd' }, [(p.src === 'cam' ? 'ถ่าย' : 'อัปโหลด') + ' ' + p.time]),
      x
    ]));
  });
}

function renderQueue() {
  Promise.all([Q.all(), Q.pAll()]).then(function (r) {
    var jobs = r[0], pics = r[1];
    var w = $('#queue-list'); w.innerHTML = '';

    // ── รูปค้างส่ง: รายการปิดไปแล้ว งานไม่ติด แต่หลักฐานยังไม่ถึงชีท ──
    if (pics.length) {

      w.appendChild(el('div', { class: 'kicker', style: 'margin-bottom:8px' }, ['รูปค้างส่ง / PHOTOS PENDING']));
      Object.keys(byRec).forEach(function (rec) {
        var list = byRec[rec];
        var err = list.filter(function (p) { return p.err; })[0];
        w.appendChild(el('div', {
          style: 'border:1px solid var(--color-accent);padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px'
        }, [
          el('div', { style: 'line-height:1.35;flex:1' }, [
            el('div', { style: 'font-family:var(--font-heading);font-weight:800;font-size:14px' },
              ['รูป ' + list.length + ' ใบ · ' + list[0].slot]),
            el('div', { style: 'font-size:11px;opacity:.7' }, ['รายการ ' + rec + ' — บันทึกลงชีทแล้ว รอแค่รูป']),
            err ? el('div', { style: 'font-size:11px;color:var(--color-accent);font-weight:600;margin-top:4px' },
              ['ส่งไม่ผ่าน · ' + err.err]) : null
          ]),
          el('div', {
            style: 'font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;white-space:nowrap;' +
                   'background:var(--color-accent);color:var(--color-bg)'
          }, ['รอส่งรูป'])
        ]));
      });
      if (jobs.length) w.appendChild(el('div', { class: 'kicker', style: 'margin:14px 0 8px' }, ['งานรอส่ง / JOBS']));
    }

    if (!jobs.length) {
      if (!pics.length) {
        w.appendChild(el('div', { class: 'surface', style: 'padding:10px;font-size:12px' }, ['ไม่มีรายการค้างในคิว']));
      }
      return;
    }
    jobs.forEach(function (j) {
      // ส่งไม่ผ่านต้องเห็นสาเหตุตรงนี้ — ไม่งั้นงานค้างอยู่โดยไม่มีใครรู้ว่าทำไม
      var rows = [
        el('div', { style: 'font-family:var(--font-heading);font-weight:800;font-size:14px' }, [j.title]),
        el('div', { style: 'font-size:11px;opacity:.7' }, [j.meta])
      ];
      if (j.err) {
        rows.push(el('div', {
          style: 'font-size:11px;line-height:1.4;margin-top:4px;color:var(--color-accent);font-weight:600'
        }, ['ส่งไม่ผ่าน ' + (j.tries || 1) + ' ครั้ง · ' + j.err]));
      }

      var del = el('button', {
        class: 'btn btn-secondary',
        style: 'font-size:11px;padding:6px 8px;white-space:nowrap'
      }, ['ลบทิ้ง']);
      del.addEventListener('click', function () {
        if (!confirm('ลบงานนี้ทิ้งถาวร?\n\n' + j.title + '\n' + j.meta +
                     '\n\nรูปที่ถ่ายไว้จะหายไปด้วย และจะไม่มีข้อมูลนี้ในชีท')) return;
        Q.del(j.clientId).then(function () { refreshQueueCount(); renderQueue(); });
      });

      w.appendChild(el('div', {
        style: 'border:1px solid ' + (j.stuck ? 'var(--color-accent)' : 'var(--color-divider)') +

        el('div', { style: 'display:flex;flex-direction:column;gap:6px;align-items:flex-end' }, [
          el('div', {
            style: 'font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;' +
                   'white-space:nowrap;color:var(--color-bg);background:' +

          }, [j.stuck ? 'ส่งไม่ได้' : 'รอส่ง']),
          j.stuck ? del : null
        ])
      ]));
    });
  });
}

function renderFooter() {
  var foot = $('#foot'), btn = $('#btn-primary'), hint = $('#foot-hint');
  var show = true, label = 'ถัดไป', okState = true, hintText = '';

  if (S.screen === 'login' && pin2Stage()) {
    label = 'ยืนยัน'; okState = S.pin.length === PIN2_LEN;
    hintText = S.pinErr || (S.pin.length < PIN2_LEN
      ? 'ใส่รหัสลับ ' + PIN2_LEN + ' หลัก · จำไว้ 8 ชม. ไม่ถามซ้ำ'
      : 'กดยืนยันได้เลย');
  } else if (S.screen === 'login') {
    // รหัสพนักงานมีทั้ง 5 และ 6 หลัก ใส่ครบแล้วกดเข้าใช้งานได้เลย
    label = 'เข้าใช้งาน'; okState = S.pin.length >= PIN_MIN;
    hintText = S.pinErr || (S.pin.length < PIN_MIN
      ? 'ใส่รหัสพนักงาน ' + PIN_MIN + '–' + PIN_MAX + ' หลัก'
      : 'กดเข้าใช้งานได้เลย');
  } else if (S.screen === 'form') {
    label = 'ไปถ่ายรูป';
    var n = totalQty();
    okState = n > 0;
    hintText = n
      ? (S.action === 'คืน' ? 'คืน ' + n + ' เครื่อง' : 'เบิก ' + n + ' เครื่อง')
      : 'ติ๊กรหัสเครื่องอย่างน้อย 1 ตัว';
  } else if (S.screen === 'shoot') {
    var st = curStep(), last = S.step >= steps().length - 1;
    label = last ? 'ตรวจทาน' : 'ถัดไป';
    if (st.type === 'cam')          { okState = !!S.shots[st.slot.th]; hintText = 'ต้องถ่ายครบ ' + reqSlots().length + ' จุด'; }
    else if (st.type === 'gallery') {
      okState = !needsGalleryPhoto() || S.extra.length > 0;
      hintText = !needsGalleryPhoto() ? 'แนบรูปเพิ่มได้ ไม่บังคับ'
        : (S.extra.length ? 'แนบแล้ว ' + S.extra.length + ' รูป' : 'ต้องแนบรูปอุปกรณ์อย่างน้อย 1 รูป');
    }
    else if (st.type === 'status')  { okState = !!S.result && issueOk(); hintText = okState ? 'เลือกแล้ว' : 'เลือกสถานะเครื่องก่อน'; }
    else                            { okState = readyToSend(); hintText = readyToSend() ? 'ครบแล้ว ไปตรวจทานได้' : missingText(); }
  } else if (S.screen === 'review') {
    label = navigator.onLine ? 'ส่งเข้าชีท' : 'บันทึกเข้าคิว';
    var all = allPhotoList(), n = upDone(all);
    hintText = !navigator.onLine ? 'สัญญาณไม่ดี จะส่งให้อัตโนมัติเมื่อกลับมา'
      : (all.length && n === all.length ? 'รูปขึ้นครบแล้ว กดส่งได้เลย'
         : (all.length ? 'อัปโหลดไปแล้ว ' + n + '/' + all.length + ' รูป' : 'เขียนลงชีทอัตโนมัติ'));
    okState = readyToSend();
  } else {
    show = false;
  }

  foot.classList.toggle('hide', !show);
  if (!show) return;
  btn.textContent = label;
  btn.disabled = !okState || S.busy;
  hint.textContent = S.busy ? (S.sendMsg || 'กำลังส่ง…') : hintText;
}

function missingText() {
  if (galleryMode()) {
    if (needsGalleryPhoto() && !S.extra.length) return 'ต้องแนบรูปอุปกรณ์อย่างน้อย 1 รูป';
  } else if (shotCount() !== reqSlots().length) {
    return 'ยังถ่ายไม่ครบ ' + shotCount() + '/' + reqSlots().length;
  }
  if (!S.result) return 'ยังไม่เลือกสถานะเครื่อง';
  if (S.result === 'มีปัญหา' && pickedAll().length > 1 && !S.issueCodes.length) {
    return 'เลือกก่อนว่าเครื่องไหนมีปัญหา';
  }
  if (!issueOk()) return 'แจ้งปัญหาต้องมีอาการ + รูปจุดที่มีปัญหา';
  if (rule('gps') && !geo.text()) return 'หัวข้อนี้บังคับเปิดตำแหน่ง (GPS)';
  return '';
}

// ══════════════════════════════════════════════════════════════════════
//  กล้องในหน้าเว็บ
//
//  เดิมกดถ่ายแล้วเด้งออกไปเปิด "แอพกล้อง" ของเครื่อง — Android (ซัมซุงเป็นหนัก)
//  จะฆ่าหน้าเว็บทิ้งเพื่อคืนหน่วยความจำให้แอพกล้อง พอถ่ายเสร็จกลับมา
//  หน้าเว็บโหลดใหม่และรูปที่เพิ่งถ่ายก็หายไปด้วย
//
//  เปิดกล้องในหน้าเว็บเองแทน ไม่มีการสลับแอพ ระบบจึงไม่ฆ่าหน้าเว็บ
//  เครื่องที่เปิดกล้องแบบนี้ไม่ได้ จะถอยไปใช้แอพกล้องเหมือนเดิมอัตโนมัติ
// ══════════════════════════════════════════════════════════════════════

var camStream = null, camBusy = false, camFailed = false, camEl = '#cam-video';

function camSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function startCam(sel) {
  var target = sel || '#cam-video';
  if (camStream && camEl === target) return Promise.resolve(true);
  if (camStream) stopCam();
  if (camBusy || !camSupported()) return Promise.resolve(false);
  camBusy = true; camEl = target;
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function (s) {
    camStream = s;
    var v = $(camEl);
    v.srcObject = s;
    v.play().catch(function () {});
    camBusy = false;
    render(); renderCamOverlay();
    return true;
  }).catch(function () {
    camBusy = false;
    camFailed = true;  // ไม่ให้สิทธิ์กล้อง หรือเครื่องไม่รองรับ — ถอยไปใช้แอพกล้องของเครื่อง
    render(); renderCamOverlay();
    return false;
  });
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
  ['#cam-video', '#camov-video'].forEach(function (id) {
    var v = $(id);
    if (v) { v.srcObject = null; if (id === '#cam-video') v.classList.add('hide'); }
  });
}

/** ดึงภาพนิ่งจากกล้องที่กำลังแสดงอยู่ */
function grabFrame() {
  var v = $(camEl);
  var w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) return Promise.reject(new Error('กล้องยังไม่พร้อม'));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(v, 0, 0, w, h);
  return new Promise(function (res, rej) {
    c.toBlob(function (b) {
      b ? res(new File([b], 'cam.jpg', { type: 'image/jpeg' })) : rej(new Error('ถ่ายไม่สำเร็จ'));
    }, 'image/jpeg', 0.92);
  });
}

/** ถ่ายจากกล้องในหน้าเว็บ ถ้าเปิดไม่ได้ค่อยถอยไปใช้แอพกล้อง */
function shootSlot(slotName) {
  if (camStream) {
    CAP = { target: 'slot', slot: slotName };
    S.busy = true; renderFooter();
    grabFrame().then(function (f) { handleFiles([f], true); })
      .catch(function (e) { S.busy = false; CAP = null; renderFooter(); toast(e.message, true); });
    return;
  }
  capture('slot', slotName, true);
}

// ── หน้ากล้องในตัว (ใช้กับหน้าแนบรูป และรูปจุดที่มีปัญหา) ────────────────

var camOv = null;   // { target, slot, title } หรือ null เมื่อปิดอยู่

function openCam(target, slotName, title) {
  if (!camSupported()) { capture(target, slotName, true); return; }   // เครื่องเก่า — ใช้แอพกล้อง
  camOv = { target: target, slot: slotName, title: title };
  CAP = { target: target, slot: slotName };
  $('#camov').classList.remove('hide');
  renderCamOverlay();
  startCam('#camov-video').then(function (ok) {
    if (!ok) { closeCam(); capture(target, slotName, true); }   // เปิดไม่ได้ ถอยไปใช้แอพกล้อง
  });
}

function closeCam() {
  camOv = null; CAP = null;
  stopCam();
  $('#camov').classList.add('hide');
  render();
}

function camOvList() {
  if (!camOv) return [];
  return camOv.target === 'issue' ? S.issueShots : S.extra;
}

function renderCamOverlay() {
  if (!camOv) return;
  var list = camOvList(), n = nowParts();
  $('#camov-title').textContent = camOv.title || 'ถ่ายรูป';
  $('#camov-count').textContent = 'ถ่ายแล้ว ' + list.length + ' รูป';
  $('#camov-stamp-txt').textContent = (geo.text() ? 'GPS ' + geo.text() + ' · ' : '') + n.date + ' ' + n.time;
  $('#camov-msg').textContent = camBusy ? 'กำลังเปิดกล้อง… กด "อนุญาต" เมื่อระบบถาม' : '';
  $('#camov-shoot').disabled = !camStream || S.busy;

  var t = $('#camov-thumbs'); t.innerHTML = '';
  list.slice(-6).forEach(function (p) {
    t.appendChild(el('img', { src: p.dataUrl, style: 'width:44px;height:44px;object-fit:cover;flex:none' }));
  });
}

function capture(target, slotName, useCamera) {
  CAP = { target: target, slot: slotName };
  // สำคัญ: เซฟก่อนเปิดกล้อง เพราะระบบอาจฆ่าหน้าเว็บทิ้งระหว่างที่กล้องเปิดอยู่
  saveDraft();
  try { sessionStorage.setItem('ppr.cap', JSON.stringify(CAP)); } catch (e) {}
  var input = useCamera ? $('#file-cam') : $('#file-up');
  input.value = '';
  input.click();
}

function handleFiles(files, fromCamera) {
  if (!files.length || !CAP) return;
  var cap = CAP;
  S.busy = true; renderFooter();

  var jobs = Array.prototype.slice.call(files).map(function (f) {
    return stampPhoto(f, stampLines(cap.slot)).then(function (dataUrl) {
      var n = nowParts();
      return { dataUrl: dataUrl, date: n.date, time: n.time, gps: geo.text(), src: fromCamera ? 'cam' : 'upload' };
    });
  });

  Promise.all(jobs).then(function (list) {
    if (cap.target === 'slot') {
      S.shots[cap.slot] = Object.assign({ id: uid('s') }, list[0]);
      bgUpload(S.shots[cap.slot], cap.slot);
      // ถ่ายเสร็จเลื่อนไปช่องถัดไปที่ยังว่างโดยอัตโนมัติ
      var req = reqSlots();
      for (var j = 1; j <= req.length; j++) {
        var i = (S.step + j) % req.length;
        if (!S.shots[req[i].th]) { S.step = i; break; }
      }
    } else if (cap.target === 'issue') {
      list.forEach(function (p) {
        var o = Object.assign({ id: uid('i') }, p);
        S.issueShots.push(o); bgUpload(o, cap.slot);
      });
    } else {
      list.forEach(function (p) {
        var o = Object.assign({ id: uid('p') }, p);
        S.extra.push(o); bgUpload(o, galleryMode() ? gallerySlotName() : 'เพิ่มเติม');
      });
    }
    S.busy = false;
    if (!camOv) CAP = null;          // หน้ากล้องเปิดอยู่ ให้ถ่ายใบถัดไปต่อได้เลย
    render(); renderCamOverlay(); saveDraft();
  }).catch(function (e) {
    S.busy = false;
    if (!camOv) CAP = null;
    render(); renderCamOverlay();
    toast(e.message || 'ประมวลผลรูปไม่สำเร็จ', true);
  });
}

// ══════════════════════════════════════════════════════════════════════
//  ส่งข้อมูล
// ══════════════════════════════════════════════════════════════════════

function buildPayload() {
  return {
    clientId: uid('s'),
    empId: S.user.id,
    topicId: S.topic.id,
    action: S.action,
    ref: S.ref,
    shift: S.shift,
    qty: totalQty(),
    forEmpId: S.forEmp ? S.forEmp.id : '',
    codes: S.picked,
    extraCodes: S.pickedExtra,
    issueCodes: S.result === 'มีปัญหา' ? S.issueCodes : [],
    result: S.result,
    issue: S.result === 'มีปัญหา' ? S.issueText : '',
    note: S.note,
    gps: geo.text(),
    photos: allPhotoList()
  };
}

/** แถบความคืบหน้าตอนส่ง — ให้พนักงานเห็นว่าระบบทำงานอยู่ จะได้ไม่กดส่งซ้ำ */
function setProgress(done, total) {
  var bar = $('#progress-bar'), fill = $('#progress-fill');
  if (total <= 0) { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  fill.style.width = Math.round(done / total * 100) + '%';
  S.sendMsg = done < total ? ('กำลังส่งรูป ' + done + '/' + total) : 'กำลังบันทึกลงชีท…';
  renderFooter();
}
function clearProgress() {
  $('#progress-bar').classList.add('hide');
  $('#progress-fill').style.width = '0';
  S.sendMsg = '';
}

// ══════════════════════════════════════════════════════════════════════
//  ทยอยอัปโหลดรูประหว่างที่ยังถ่ายอยู่
//
//  เดิมกดส่งแล้วค่อยอัปโหลดรูปทั้งชุด พนักงานต้องยืนรอเป็นนาที
//  ตอนนี้พอถ่ายเสร็จใบไหน ใบนั้นวิ่งขึ้นเซิร์ฟเวอร์ทันทีระหว่างเดินไปถ่ายจุดต่อไป
//  กดส่งจริงจึงเหลือแค่เขียนแถวลงชีท ไม่กี่วินาที
//
//  ล้มเหลวระหว่างทางไม่เป็นไร ตอนกดส่งจะอัปใบที่ยังไม่ขึ้นให้เอง
// ══════════════════════════════════════════════════════════════════════

var UPLOAD_PARALLEL = 4;   // มากกว่านี้เสี่ยงชนโควตา "รันพร้อมกัน" ของ Apps Script

/** จองรหัสรายการ + โฟลเดอร์ (ครั้งเดียวต่องาน) */
function ensureJob() {
  if (S.job) return Promise.resolve(S.job);
  if (S.jobWait) return S.jobWait;
  S.jobWait = rpc('apiReserve', S.user.id, S.topic.id).then(function (r) {
    S.job = { recordId: r.recordId, folderId: r.folderId, folderUrl: r.folderUrl };
    return S.job;
  }).catch(function (e) { S.jobWait = null; throw e; });
  return S.jobWait;
}

/** อัปโหลดรูป 1 ใบเบื้องหลัง — เงียบ ๆ ไม่รบกวนผู้ใช้ */
function bgUpload(p, slot) {
  if (!p || !p.id || !navigator.onLine || !S.user || !S.topic) return;
  if (S.up[p.id] || S.upBusy[p.id]) return;
  S.upBusy[p.id] = ensureJob().then(function (j) {
    return rpc('apiUploadPhoto', S.user.id, j.recordId, j.folderId,
               slot, p.dataUrl, p.time, p.gps, ++S.upSeq);
  }).then(function (row) {
    S.up[p.id] = row;
    delete S.upBusy[p.id];
    if (S.screen === 'shoot' || S.screen === 'review') renderFooter();
  }).catch(function () {
    delete S.upBusy[p.id];   // ไว้ไปอัปใหม่ตอนกดส่ง
  });
}

function upDone(photos) {
  return photos.filter(function (p) { return S.up[p.id]; }).length;
}

/**
 * ส่ง: รอเฉพาะใบที่กำลังวิ่งอยู่ → ปิดรายการทันที → รูปที่เหลือตามส่งทีหลัง
 *
 * ของเดิมต้องอัปรูปที่ค้างให้ครบก่อนถึงจะยอมเขียนแถว
 * เน็ตหน้างานสะดุดทีเดียว = ยืนรอเป็นนาที และถ้าล้มก็ไม่ได้แถวเลย
 * ทั้งที่ข้อมูลสำคัญจริง ๆ ("เบิกไปแล้ว / คืนแล้ว") หนักไม่ถึงกิโลไบต์
 *
 * ตอนนี้ปิดรายการด้วยรูปเท่าที่ขึ้นไปแล้ว แล้วโยนที่เหลือเข้าคิวรูป
 * เครื่องจึงไม่มีวันล็อกค้างเพราะรูปอัปไม่ทัน
 */
function sendNow(payload) {
  var photos = payload.photos || [];
  var lite = Object.assign({}, payload);
  delete lite.photos;   // commit ไม่ต้องใช้ไฟล์รูป ไม่ต้องส่งซ้ำให้เปลืองเน็ต

  setProgress(upDone(photos), photos.length);

  return ensureJob().then(function (j) {
    // รอใบที่กำลังวิ่งอยู่ให้จบก่อน (ใกล้เสร็จแล้ว) จะได้ไม่อัปซ้ำเป็นสองใบ
    return Promise.all(Object.keys(S.upBusy).map(function (k) { return S.upBusy[k]; }))
      .catch(function () {})
      .then(function () {
        var rows = photos.map(function (p) { return S.up[p.id]; }).filter(Boolean);
        var left = photos.filter(function (p) { return !S.up[p.id]; });
        // บอกเซิร์ฟเวอร์ว่าช่องไหนถ่ายไว้แล้วแต่รูปยังเดินทางอยู่
        // การตรวจ "ถ่ายครบทุกช่องบังคับ" จึงยังเข้มเท่าเดิม
        var pending = left.map(function (p) { return p.slot || ''; }).filter(Boolean);

        S.sendMsg = 'กำลังบันทึกลงชีท…'; renderFooter();
        return rpc('apiCommitSubmit', lite, rows, j.recordId, j.folderUrl, pending)
          .then(function (res) {
            if (!left.length) return res;
            return queuePhotos(payload.empId, j, left).then(function () {
              refreshQueueCount();
              res.pendingPhotos = left.length;
              return res;
            });
          });
      });
  }).catch(function (e) {
    // หลังบ้านยังเป็นเวอร์ชันเก่า — ถอยไปส่งครั้งเดียวแบบเดิม
    if (/ไม่รู้จักคำสั่ง/.test(e.message)) return rpc('apiSubmit', payload);
    throw e;
  });
}

function submit() {
  if (!readyToSend()) { toast(missingText(), true); return; }
  var payload = buildPayload();
  var n = nowParts();
  var meta = {
    clientId: payload.clientId,
    title: S.topic.name + ' · ' + S.action + ' · ' + S.user.dept,
    meta: n.date + ' ' + n.hhmm + ' · ' + payload.photos.length + ' รูป',
    payload: payload
  };
  var queueIt = function (why) {
    clearProgress();
    if (why) { meta.err = why; meta.tries = 1; meta.errAt = Date.now(); }
    Q.put(meta).then(function () {
      refreshQueueCount();
      showDone({ queued: true, photoCount: payload.photos.length, why: why });
    });
  };

  if (!navigator.onLine) { queueIt(); return; }

  S.busy = true; renderFooter();
  sendNow(payload).then(function (res) {
    S.busy = false; clearProgress();
    // ลบรายการค้างคืนที่เพิ่งปิดออกจากหน้าจอทันที ไม่ต้องรอโหลดใหม่
    if (S.action === 'คืน') S.openJobs = S.openJobs.filter(function (j) { return j.id !== S.ref; });
    showDone(res);
    refresh();
  }).catch(function (e) {
    S.busy = false;
    // ส่งไม่ผ่านเพราะเน็ต → เก็บเข้าคิวส่งใหม่ทีหลัง; ผิดกติกา → บอกให้แก้
    if (/เซิร์ฟเวอร์|network|timeout|failed to fetch/i.test(e.message)) queueIt(e.message);
    else { clearProgress(); renderFooter(); toast(e.message, true); }
  });
}

function showDone(res) {
  var n = nowParts();
  // ยังไม่ถึงชีท ต้องพูดให้ชัดว่า "ยังไม่เสร็จ" ไม่ใช่ขึ้นว่าเรียบร้อยแล้วปล่อยเลยไป
  // ของเดิมขึ้นว่า "บันทึกไว้ในเครื่องแล้ว" ซึ่งอ่านแล้วเข้าใจว่าจบงาน
  $('#done-title').textContent = res.queued ? 'ยังไม่ถึงชีท · เก็บไว้ในเครื่องก่อน'
    : (S.action === 'คืน' ? 'คืนเครื่องเรียบร้อย' : 'เบิกเครื่องเรียบร้อย');
  $('#done-sub').textContent = res.queued
    ? ((res.why ? res.why + ' · ' : '') +
       'งานนี้ยังไม่เข้าระบบ อยู่ในคิวรอส่ง จะส่งเองเมื่อสัญญาณกลับมา ' +
       'ถ้ายังไม่หายให้เข้าเมนู "คิวรอส่ง" แล้วกดส่งเอง — อย่าเพิ่งปิดแอพทิ้ง')
    : ((S.action === 'คืน'
        ? 'ปิดรายการค้างคืนแล้ว · บันทึกลงชีทเป็นรหัส ' + res.recordId
        : 'บันทึกลงชีทเป็นรหัส ' + res.recordId + ' · จะขึ้นในตารางค้างคืนจนกว่าจะกดคืน') +
       // รูปยังไม่ครบไม่ได้แปลว่างานไม่สำเร็จ — แถวลงชีทแล้ว เครื่องไม่ล็อกค้าง
       // แต่ต้องบอกให้รู้ว่ายังมีรูปเดินทางอยู่ ไม่ใช่ปล่อยให้เข้าใจว่าจบสมบูรณ์
       (res.pendingPhotos
         ? '\n\nรูปอีก ' + res.pendingPhotos + ' ใบกำลังตามส่งเบื้องหลัง ระบบส่งเองให้ ' +
           'ถ้ายังไม่หมดจะขึ้นเตือนที่หน้าหลัก — ไม่ต้องถ่ายใหม่'
         : ''));
  // ── จำนวนตัวใหญ่ ให้เห็นชัดว่าเพิ่งเบิกหรือคืนไปกี่เครื่อง ──
  var back = S.action === 'คืน';
  var qty = totalQty(), xt = extraType(), nx = S.pickedExtra.length;
  $('#done-qty').textContent = (back ? 'คืน ' : 'เบิก ') + qty + ' เครื่อง';

  // ตอนคืน ถ้าคืนไม่ครบตามที่เบิกไป ต้องบอกให้รู้ตัวตรงนี้เลย
  var left = back && S.borrowedQty ? S.borrowedQty - qty : 0;
  var sub = $('#done-qty-sub');
  if (left > 0) {
    sub.textContent = 'เบิกไป ' + S.borrowedQty + ' เครื่อง · ยังค้างอีก ' + left + ' เครื่อง';
    sub.style.color = 'var(--color-accent)';
    sub.style.opacity = '1';
  } else {
    var parts = [];
    if (nx && xt) parts.push((S.topic ? S.topic.name : 'เครื่อง') + ' ' + S.picked.length + ' · ' + xt + ' ' + nx);
    if (back && S.borrowedQty) parts.push('คืนครบตามที่เบิกไป');
    sub.textContent = parts.join(' · ');
    sub.style.color = '';
    sub.style.opacity = '.7';
  }

  var o = owner();
  $('#done-info').innerHTML =
    row2(back ? 'ผู้คืน' : 'ผู้เบิก', o ? o.name : '—') +
    row2('รหัสพนักงาน · แผนก', o ? (o.id + ' · ' + o.dept) : '—') +
    (S.forEmp ? row2('บันทึกโดย', S.user.name + ' (แอดมิน)') : '') +
    row2('ประทับเวลา', res.ts || (n.date + ', ' + n.time)) +
    row2('จำนวนเครื่อง', qty + ' เครื่อง') +
    ((nx && xt) ? row2(xt, nx + ' เครื่อง') : '') +
    row2('รหัสเครื่อง', codesText()) +
    row2('รูปที่แนบ', (res.photoCount || 0) + ' รูป') +
    row2('สถานะเครื่อง', S.result || '—') +
    (res.recordId ? row2('รหัสรายการ', res.recordId) : '');

  // ทิ้งรูปออกจากหน่วยความจำทันทีที่ส่งสำเร็จ — แอพหน้างานไม่เก็บและไม่เปิดดูรูปย้อนหลัง
  // (ถ้าเข้าคิวออฟไลน์ ยังต้องถือรูปไว้จนกว่าจะส่งได้)
  if (!res.queued) dropPhotos();
  clearDraft();

  go('done');
}

/** ล้างรูปทั้งหมดออกจาก state และคืนหน่วยความจำ */
function dropPhotos() {
  Object.keys(S.shots).forEach(function (k) { delete S.shots[k]; });
  S.extra.length = 0;
  S.issueShots.length = 0;
}

// ══════════════════════════════════════════════════════════════════════
//  กู้งานที่ทำค้างไว้
//
//  Android (ซัมซุงเป็นเยอะ) ชอบฆ่าหน้าเว็บทิ้งตอนเปิดกล้อง เพื่อคืนหน่วยความจำ
//  พอถ่ายเสร็จกลับมา หน้าเว็บโหลดใหม่ทั้งหมด งานที่ทำค้างจะหายเกลี้ยง
//  จึงเก็บสถานะงาน (รวมรูปที่ถ่ายไปแล้ว) ลงเครื่องไว้ แล้วกู้กลับตอนเปิดมาใหม่
// ══════════════════════════════════════════════════════════════════════

function saveDraft() {
  if (!S.user || !S.topic) return;
  if (['form', 'shoot', 'review'].indexOf(S.screen) < 0) return;
  Q.putDraft({
    ts: Date.now(), empId: S.user.id,
    screen: S.screen, step: S.step,
    topicId: S.topic.id, action: S.action, ref: S.ref, shift: S.shift,
    picked: S.picked, pickedExtra: S.pickedExtra, issueCodes: S.issueCodes, qty: S.qty,
    shots: S.shots, extra: S.extra, issueShots: S.issueShots,
    result: S.result, issueText: S.issueText, note: S.note
  }).catch(function () { /* เต็มหรือเขียนไม่ได้ ก็ปล่อยไป ไม่ให้แอพสะดุด */ });
}

function clearDraft() { Q.delDraft().catch(function () {}); }

function restoreDraft() {
  return Q.getDraft().then(function (d) {
    if (!d || !S.user || d.empId !== S.user.id) return false;
    if (Date.now() - (d.ts || 0) > 12 * 3600 * 1000) { clearDraft(); return false; }  // ค้างข้ามวันถือว่าเลิกแล้ว
    var t = S.topics.filter(function (x) { return x.id === d.topicId; })[0];
    if (!t) { clearDraft(); return false; }

    S.topic = t; S.action = d.action || 'เบิก'; S.ref = d.ref || '';
    S.shift = d.shift || S.user.shift;
    S.picked = d.picked || []; S.pickedExtra = d.pickedExtra || [];
    S.issueCodes = d.issueCodes || []; S.qty = d.qty || 1;
    S.shots = d.shots || {}; S.extra = d.extra || []; S.issueShots = d.issueShots || [];
    S.result = d.result || ''; S.issueText = d.issueText || ''; S.note = d.note || '';
    S.step = d.step || 0;
    go(d.screen || 'form');

    var n = allPhotoList().length;
    toast('กู้งานที่ทำค้างไว้แล้ว' + (n ? ' · รูป ' + n + ' ใบยังอยู่ครบ' : ''), false, 6000);
    return true;
  }).catch(function () { return false; });
}

function refreshQueueCount() {
  return Promise.all([Q.count(), Q.pCount()]).then(function (r) {
    S.queueCount = r[0];
    S.photoCount = r[1];
    if (S.screen === 'home') {
      $('#queue-badge').textContent = r[0] + r[1];
      renderHomeWarn();
    }
  });
}

/**
 * เวอร์ชันของหน้าจอที่เครื่องนี้กำลังรันอยู่
 *
 * ค่าถูกฝังตอน build จากเลขเดียวกับ Service Worker (build-web.ps1 อ่านมาจาก sw.js)
 * จึงตอบได้ตรง ๆ ว่า "เครื่องนี้อัปแล้วหรือยัง" ไม่ใช่เลขที่ตั้งมือแล้วลืมขยับ
 * เสิร์ฟจาก Apps Script จะไม่มีค่านี้ (ไม่ได้ผ่าน build) จึงขึ้นว่า dev
 */
function appVersion() { return window.APP_VERSION || 'dev'; }

/**
 * ตื๊อส่งของค้างเองระหว่างที่แอพยังเปิดอยู่
 *
 * ของเดิมลองใหม่แค่ตอน "สัญญาณกลับมา" กับตอนเปิดแอพ
 * แต่กรณีที่เจอบ่อยคือสัญญาณติด ๆ ดับ ๆ อยู่กับที่ ไม่เคยยิง event ให้เลย
 * พนักงานส่วนใหญ่ยังยืนอยู่หน้างานตอนนั้น — ลองเองเงียบ ๆ ทุก 30 วิ
 * ส่วนใหญ่จะขึ้นครบตั้งแต่ยังไม่ทันเดินออกจากพื้นที่ โดยไม่ต้องรู้ตัวด้วยซ้ำ
 */
var AUTO_RETRY_MS = 30000;
var autoRetryTimer = null;

function startAutoRetry() {
  if (autoRetryTimer) return;
  autoRetryTimer = setInterval(function () {
    if (!S.user || !navigator.onLine || S.busy) return;
    if (!S.queueCount && !S.photoCount) return;
    flushPending();
  }, AUTO_RETRY_MS);
}

/** ส่งของค้างทั้งสองคิว (งาน + รูป) แล้วอัปเดตหน้าจอ */
function flushPending(loud) {
  return flushQueue().then(function (n) {
    return flushPhotos().then(function (k) {
      return refreshQueueCount().then(function () {
        if (S.screen === 'queue') renderQueue();
        if (n) refresh();
        if (loud && (n || k)) {
          toast('ส่งของค้างแล้ว' + (n ? ' · งาน ' + n + ' รายการ' : '') +
                (k ? ' · รูป ' + k + ' ใบ' : ''));
        }
        return { jobs: n, photos: k };
      });
    });
  });
}

function refresh() {
  if (!S.user) return Promise.resolve();
  return rpc('apiRefresh', S.user.id, '', store.get('ticket', '')).then(function (r) {
    // ตั๋วหมดอายุระหว่างใช้งาน — ไม่เด้งออกกลางคัน ปล่อยให้ทำงานที่ค้างอยู่ต่อจนจบ
    // ต้องใส่รหัสลับใหม่ตอนเปิดแอพครั้งหน้า
    if (r.needPin) return;
    if (r.ticket) store.set('ticket', r.ticket);
    S.stale = false;
    applySession(r);
    if (S.screen === 'home') renderHome();
  }).catch(function () {
    // ดึงของใหม่ไม่ได้ — ใช้ข้อมูลเดิมไปก่อนได้ แต่ต้องบอกให้รู้ว่าเป็นของเก่า
    // ไม่งั้นจะเห็นรายการค้างคืนที่คนอื่นคืนไปแล้วค้างอยู่บนจอโดยไม่รู้ตัว
    S.stale = true;
    if (S.screen === 'home') renderHomeWarn();
  });
}

function applySession(r, fromCache) {
  S.user = r.user; S.isAdmin = r.isAdmin;
  S.topics = r.topics; S.assets = r.assets; S.shifts = r.shifts;
  S.issueTags = r.issueTags; S.openJobs = r.openJobs; S.today = r.today;
  // เครื่องที่คนอื่นเบิกไปแล้วยังไม่คืน — ไม่เก็บลงเครื่อง เพราะของเก่าอาจคืนไปแล้ว
  // ตอนเปิดจากแคชจึงว่างไว้ก่อน แล้ว refresh() จะเติมให้เอง (ฝั่งชีทกันซ้ำอีกชั้นอยู่แล้ว)
  S.busyCodes = r.busyCodes || {};
  S.staffList = r.staffList || [];   // มีเฉพาะแอดมิน ไว้เลือกตอนบันทึกแทนคนอื่น
  if (!S.shift) S.shift = r.user.shift;

  // จำข้อมูลตั้งค่าไว้ในเครื่อง เพื่อให้เปิดแอพครั้งหน้าขึ้นหน้าหลักทันทีโดยไม่ต้องรอเซิร์ฟเวอร์
  // (เก็บเฉพาะทะเบียน/หัวข้อ/รายการค้างคืน — ไม่มีรูปอยู่ในนี้)
  if (!fromCache) {
    store.set('session', {
      user: r.user, isAdmin: r.isAdmin, topics: r.topics, assets: r.assets,
      shifts: r.shifts, issueTags: r.issueTags, openJobs: r.openJobs, today: r.today
    });
  }
}

// ══════════════════════════════════════════════════════════════════════
//  เชื่อมปุ่ม
// ══════════════════════════════════════════════════════════════════════

function bind() {
  $('#btn-back').addEventListener('click', back);
  $('#remember').addEventListener('click', function () {
    S.remember = !S.remember; store.set('remember', S.remember); render();
  });
  $('#btn-logout').addEventListener('click', function () {
    if (!confirm('ออกจากระบบ?\nรายการค้างคืนยังอยู่ในระบบ เข้ามาใหม่ด้วยรหัสเดิมได้ตลอด')) return;
    // ทิ้งตั๋วรหัสลับด้วย — เข้าใหม่ต้องใส่รหัส 3 หลักอีกครั้ง
    store.del('empId'); store.del('session'); store.del('ticket');
    S.user = null; S.pin = ''; S.stage = 'id'; S.pin2Id = ''; S.pin2Name = '';
    resetJob(); dropPhotos(); go('login');
  });
  $('#btn-queue').addEventListener('click', function () { go('queue'); });

  // แตะเลขเวอร์ชัน = เช็คของใหม่ + ส่งของค้างเดี๋ยวนี้
  // มีไว้ให้บอกหน้างานทางโทรศัพท์ได้ว่า "แตะเลขมุมขวาบนให้พี่หน่อย"
  $('#app-ver').addEventListener('click', function () {
    var msg = 'เวอร์ชัน ' + appVersion() + (window.APP_BUILT ? ' · อัปเดต ' + window.APP_BUILT : '');
    var n = S.queueCount + S.photoCount;
    if (n) msg += ' · ยังค้าง ' + n + ' รายการ';
    toast(msg, false, 7000);

    if (!navigator.onLine) { toast('ยังไม่มีสัญญาณ — เช็คของใหม่ไม่ได้', true); return; }
    if (n) flushPending(true);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration()
        .then(function (reg) { if (reg) reg.update(); })
        .catch(function () {});
    }
  });
  $('#btn-home').addEventListener('click', function () { clearDraft(); resetJob(); refresh(); go('home'); });

  $('#btn-shoot').addEventListener('click', function () {
    var st = curStep();
    if (st.type !== 'cam') return;
    if (S.shots[st.slot.th]) { nextStep(); return; }
    shootSlot(st.slot.th);
  });
  $('#forwho-self').addEventListener('click', function () {
    S.forEmp = null; S.forPick = false; S.shift = S.user.shift; render();
  });
  $('#forwho-other').addEventListener('click', function () { S.forPick = true; render(); });
  $('#forwho-q').addEventListener('input', function () { renderForWho(); });

  $('#btn-cam-up').addEventListener('click', function () {
    var st = curStep();
    if (st.type !== 'cam') return;
    capture('slot', st.slot.th, false);
  });
  $('#btn-retake').addEventListener('click', function () {
    var st = curStep();
    if (st.type !== 'cam') return;
    delete S.shots[st.slot.th];   // ลบรูปเดิมก่อน เพื่อให้กล้องสดกลับมาแสดง
    render();
    shootSlot(st.slot.th);
  });
  $('#btn-gal-cam').addEventListener('click', function () {
    openCam('extra', 'เพิ่มเติม', 'ถ่ายรูปอุปกรณ์');
  });

  $('#camov-shoot').addEventListener('click', function () {
    if (!camStream || S.busy) return;
    S.busy = true; renderCamOverlay();
    grabFrame().then(function (f) { handleFiles([f], true); })
      .catch(function (e) { S.busy = false; renderCamOverlay(); toast(e.message, true); });
  });
  $('#camov-close').addEventListener('click', closeCam);
  $('#camov-done').addEventListener('click', closeCam);
  $('#btn-gal-up').addEventListener('click', function () { capture('extra', 'เพิ่มเติม', false); });
  $('#btn-gal-clear').addEventListener('click', function () { S.extra = []; render(); });

  $('#st-ok').addEventListener('click', function () { S.result = 'ปกติ'; render(); });
  $('#st-issue').addEventListener('click', function () { S.result = 'มีปัญหา'; render(); });
  $('#issue-text').addEventListener('input', function (e) { S.issueText = e.target.value; renderFooter(); });
  $('#btn-issue-cam').addEventListener('click', function () {
    openCam('issue', issueSlotName(), 'ถ่ายรูป' + issueSlotName());
  });
  $('#btn-issue-up').addEventListener('click', function () { capture('issue', issueSlotName(), false); });
  $('#btn-issue-clear').addEventListener('click', function () { S.issueShots = []; render(); });
  $('#note-text').addEventListener('input', function (e) { S.note = e.target.value; });

  $('#file-cam').addEventListener('change', function (e) { handleFiles(e.target.files, true); });
  $('#file-up').addEventListener('change', function (e) { handleFiles(e.target.files, false); });

  $('#btn-sync').addEventListener('click', function () {
    if (!navigator.onLine) { toast('ยังไม่มีสัญญาณ', true); return; }
    toast('กำลังส่ง…');
    flushPending().then(function (r) {
      var ok = [];
      if (r.jobs)   ok.push('งาน ' + r.jobs + ' รายการ');
      if (r.photos) ok.push('รูป ' + r.photos + ' ใบ');
      toast(ok.length ? 'ส่งสำเร็จ · ' + ok.join(' · ')
                      : 'ยังส่งไม่ได้ — ดูสาเหตุใต้ชื่อรายการด้านล่าง', !ok.length);
    });
  });

  $('#btn-primary').addEventListener('click', function () {
    if (S.screen === 'login')  return doLogin();
    if (S.screen === 'form')   { S.step = 0; return go('shoot'); }
    if (S.screen === 'shoot')  return nextStep();
    if (S.screen === 'review') return submit();
  });

  window.addEventListener('online', function () {
    render();
    if (S.queueCount || S.photoCount) flushPending(true);
  });
  window.addEventListener('offline', render);

  // เซฟงานที่ทำค้างทุกครั้งที่แอพกำลังจะถูกพักหรือปิด
  window.addEventListener('pagehide', function () { saveDraft(); stopCam(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { saveDraft(); stopCam(); }
    else {
      if (S.screen === 'shoot' && curStep() && curStep().type === 'cam') startCam();
      // สลับกลับมาที่แอพ = จังหวะที่ต้องรีบส่งของค้างที่สุด
      //
      // มือถือจะ "แช่แข็ง" หน้าเว็บที่ไม่ได้อยู่บนจอเพื่อประหยัดแบต
      // ตัวนับ 30 วินาทีจึงถูกหน่วงแล้วหยุดไปเลย และบางเครื่องไม่ฟื้นเองด้วย
      // คนที่กดปุ่มโฮมออกไปแล้ววันหลังสลับกลับมา (ไม่ได้เปิดใหม่)
      // จึงไม่เคยมีอะไรมากระตุ้นให้ส่ง — รูปค้างเงียบอยู่ในเครื่องได้เป็นวัน
      if (S.user && navigator.onLine && (S.queueCount || S.photoCount)) flushPending();
    }
  });
}

function nextStep() {
  var all = steps(), st = curStep();
  if (st.type === 'cam' && !S.shots[st.slot.th]) return;
  if (st.type === 'gallery' && needsGalleryPhoto() && !S.extra.length) return;
  if (st.type === 'status' && (!S.result || !issueOk())) return;
  if (S.step >= all.length - 1) {
    if (!readyToSend()) { toast(missingText(), true); return; }
    return go('review');
  }
  S.step++; render(); saveDraft();
}

function doLogin() {
  var p2 = pin2Stage();
  var id = p2 ? S.pin2Id : S.pin;
  var pin2 = p2 ? S.pin : '';

  S.busy = true; renderFooter();
  rpc('apiLogin', id, pin2, store.get('ticket', '')).then(function (r) {
    S.busy = false;

    // บัญชีนี้ตั้งรหัสลับไว้ — ไปขั้นถามรหัส 3 หลักก่อน
    if (r.needPin) {
      S.stage = 'pin2'; S.pin2Id = id; S.pin2Name = r.name || '';
      S.pin = ''; S.pinErr = ''; render();
      return;
    }

    // ตั๋วยืนยันรหัสลับ อายุ 8 ชม. นับจากครั้งล่าสุดที่ใช้ (ตัวรหัสไม่ได้เก็บไว้)
    if (r.ticket) store.set('ticket', r.ticket);

    if (S.remember) store.set('empId', r.user.id); else store.del('empId');
    applySession(r);
    S.pin = ''; S.pinErr = ''; S.stage = 'id'; S.pin2Id = ''; S.pin2Name = '';
    go('home');
    startAutoRetry();
    if (navigator.onLine) flushPending();
  }).catch(function (e) {
    S.busy = false; S.pin = ''; S.pinErr = e.message; render();
  });
}

/** กลับไปขั้นใส่รหัสพนักงาน (กดย้อนจากหน้ารหัสลับ) */
function backToId() {
  S.stage = 'id'; S.pin = S.pin2Id; S.pin2Id = ''; S.pin2Name = ''; S.pinErr = '';
  render();
}

// ══════════════════════════════════════════════════════════════════════
//  เริ่มทำงาน
// ══════════════════════════════════════════════════════════════════════

(function boot() {
  bind();
  geo.start();
  // อัปเดตแถบบนสุด (สัญญาณ/พิกัด) โดยไม่วาดหน้าจอใหม่ทั้งหมด
  setInterval(function () {
    $('#bar-l').textContent = navigator.onLine ? '5G' : 'ไม่มีสัญญาณ';
    $('#bar-r').textContent = geo.text() ? 'GPS ' + geo.text() : 'ยังไม่มีพิกัด';
  }, 4000);
  refreshQueueCount();

  var saved = store.get('empId', '');
  if (!saved) { go('login'); loadDemo(); return; }

  // 1) ขึ้นหน้าหลักทันทีจากข้อมูลที่จำไว้ในเครื่อง — ไม่ต้องรอเซิร์ฟเวอร์
  var restored = false;
  var cached = store.get('session', null);
  if (cached && cached.user && cached.user.id === saved) {
    applySession(cached, true);
    go('home');
    // 1.5) มีงานทำค้างไว้ไหม (เช่นระบบฆ่าหน้าเว็บทิ้งตอนเปิดกล้อง) — กู้กลับให้ทำต่อ
    restoreDraft().then(function (ok) { restored = ok; });
  }

  // 2) แล้วค่อยดึงของจริงมาทับเงียบ ๆ (ทะเบียน/หัวข้อ/รายการค้างคืนอาจเปลี่ยน)
  rpc('apiLogin', saved, '', store.get('ticket', '')).then(function (r) {
    // บัญชีที่ตั้งรหัสลับไว้และตั๋วหมดอายุ (ไม่ได้แตะเกิน 8 ชม.) ต้องใส่รหัสใหม่
    if (r.needPin) {
      S.user = null;
      S.stage = 'pin2'; S.pin2Id = saved; S.pin2Name = r.name || '';
      S.pin = ''; S.pinErr = '';
      go('login');
      return;
    }
    if (r.ticket) store.set('ticket', r.ticket);

    var wasWorking = ['form', 'shoot', 'review'].indexOf(S.screen) >= 0;
    applySession(r);
    if (wasWorking) return;                       // กำลังทำงานค้างอยู่ อย่าเด้งกลับหน้าหลัก
    if (S.screen === 'home') renderHome(); else go('home');
    if (!restored) restoreDraft();
    // เปิดแอพรอบใหม่ = จังหวะที่ดักคนที่ยังมีของค้างได้แน่นอนที่สุด
    // (กะหน้าเขาต้องเปิดแอพมาเบิกอยู่แล้ว) ส่งให้เองเงียบ ๆ ก่อน
    // เหลืออะไรค้างค่อยขึ้นแถบเตือนที่หน้าหลักให้กดส่งเอง
    startAutoRetry();
    if (navigator.onLine) flushPending();
  }).catch(function () {
    // ไม่มีสัญญาณ: ถ้ามีข้อมูลที่จำไว้ก็ใช้ต่อได้ ถ้าไม่มีค่อยกลับไปหน้าล็อกอิน
    if (!S.user) { store.del('empId'); go('login'); loadDemo(); }
  });
})();

function loadDemo() {
  rpc('apiHello').then(function (r) {
    var w = $('#demo-list'); w.innerHTML = '';
    (r.demo || []).forEach(function (p) {
      var b = el('button', {
        style: 'text-align:left;padding:6px 8px;font-size:12px;background:transparent;' +
               'border:1px solid var(--color-divider);cursor:pointer;color:var(--color-text);font-family:var(--font-body)'
      }, [p.id + ' · ' + p.name + ' · ' + p.role]);
      b.addEventListener('click', function () { S.pin = p.id; S.pinErr = ''; render(); });
      w.appendChild(b);
    });
    $('#demo-wrap').classList.toggle('hide', !(r.demo || []).length);
  }).catch(function (e) { toast(e.message, true); });
}
</script>
