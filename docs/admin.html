<style>
/* ══════════════════════════════════════════════════════════════════════
   Modernist — โทเคนและคลาสจากดีไซน์ซิสเต็มของโปรเจกต์
   (คัดมาจาก _ds/modernist-.../styles.css แล้วเพิ่มฟอนต์ไทย)

   ฟอนต์โหลดด้วย <link> ใน <head> ของ app.html / admin.html ไม่ใช่ @import ตรงนี้
   เพราะ @import ในไฟล์ CSS ทำให้เบราว์เซอร์ต้องอ่าน CSS จบก่อนถึงจะเริ่มโหลดฟอนต์ (ช้ากว่ามาก)
   ══════════════════════════════════════════════════════════════════ */

:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#ec3013;
  --color-accent-2:#e15b47;
  --color-divider:color-mix(in srgb,#201e1d 40%,transparent);

  --color-neutral-100:#f8f4f4; --color-neutral-200:#eae7e7; --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6; --color-neutral-500:#9b9797; --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d; --color-neutral-800:#444141; --color-neutral-900:#2d2b2b;

  --color-accent-100:#fff2ef; --color-accent-200:#ffe0d9; --color-accent-300:#ffc4b8;
  --color-accent-400:#ff9783; --color-accent-500:#ff563c; --color-accent-600:#dd2b0f;
  --color-accent-700:#ae1800; --color-accent-800:#7c1405; --color-accent-900:#4d170e;

  --font-heading:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:0px; --radius-md:0px; --radius-lg:0px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg); color:var(--color-text);
  font-family:var(--font-body); font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,h5,h6{
  font-family:var(--font-heading); font-weight:800;
  line-height:1.14; letter-spacing:-0.015em; margin:0 0 var(--space-2);
}
h1{font-size:32px} h2{font-size:25px} h3{font-size:20px} h4{font-size:17px}
p{margin:0 0 var(--space-3)}
a{color:var(--color-accent-700);text-decoration:none}
a:hover{color:var(--color-accent)}
img{display:block;max-width:100%}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--color-text) 25%,transparent)}

.hr{height:2px;border:0;margin:var(--space-4) 0;background:var(--color-divider)}
.muted{color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.kicker{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)}
.label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:.6;margin-bottom:6px;display:block}
.mono{font-variant-numeric:tabular-nums}
/* ไม่มีคลาส .grayscale แล้ว — รูปงานตรวจสอบต้องเป็นสี เพราะสีคือข้อมูล
   สนิม น้ำมันรั่ว แบตบวม จอแตก ไฟสถานะ ดูขาวดำแล้วแยกไม่ออก
   ของเดิมใส่ฟิลเตอร์ไว้ตามธีมดีไซน์เฉย ๆ ไม่ได้ช่วยเรื่องขนาดหรือความเร็ว */
.hide{display:none !important}

/* — ปุ่ม — */
.btn{
  display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;
  cursor:pointer;text-decoration:none;font-family:var(--font-heading);font-weight:800;
  font-size:14px;line-height:1.2;color:var(--color-text);
  background:transparent;border:1px solid transparent;
  padding:var(--space-2) calc(var(--space-3) * 1.2);border-radius:0;
}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent)}
.btn-primary:hover:not(:disabled){background:var(--color-accent-600)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover:not(:disabled){background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-dark{background:var(--color-text);color:var(--color-bg)}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1)}
.btn-block{width:100%;justify-content:flex-start}
.btn-lg{height:52px;padding:0 20px;font-size:15px}

/* — ฟอร์ม — */
.input,select.input,textarea.input{
  width:100%;min-height:38px;padding:8px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);
  background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0;
}
textarea.input{min-height:90px;resize:vertical}
.input:focus-visible{border-color:var(--color-accent)}

.chip{
  padding:7px 11px;font-size:12px;cursor:pointer;font-family:var(--font-body);
  border:1px solid var(--color-divider);background:transparent;color:var(--color-text);
}
.chip.on{border-color:var(--color-accent);background:var(--color-accent);color:var(--color-bg)}

.toggle{
  width:46px;height:26px;flex:none;border:1px solid var(--color-divider);
  background:transparent;cursor:pointer;padding:2px;display:flex;justify-content:flex-start;
}
.toggle.on{border-color:var(--color-accent);background:var(--color-accent);justify-content:flex-end}
.toggle > span{display:block;width:20px;height:20px;background:var(--color-text);opacity:.5}
.toggle.on > span{background:var(--color-bg);opacity:1}

/* — การ์ด / ตาราง — */
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);background:var(--color-surface)}
.surface{background:var(--color-surface)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{
  text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in srgb,var(--color-text) 60%,transparent);
  padding:var(--space-2);border-bottom:2px solid var(--color-divider);white-space:nowrap;
}
.table td{padding:var(--space-2);border-bottom:1px solid var(--color-divider);vertical-align:top}
.table tbody tr:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent)}

.tag{display:inline-block;padding:2px 8px;font-size:11px;letter-spacing:.06em;background:var(--color-surface)}
.tag-issue{background:var(--color-accent);color:var(--color-bg)}

.stat{border-top:2px solid var(--color-text);padding-top:8px}
.stat .v{font-family:var(--font-heading);font-weight:800;font-size:26px;line-height:1}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}

/* — แถบแจ้งเตือน — */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  max-width:min(520px,92vw);padding:12px 16px;z-index:200;
  background:var(--color-text);color:var(--color-bg);font-size:13px;line-height:1.5;
  box-shadow:var(--shadow-lg);
}
.toast.err{background:var(--color-accent)}

.overlay{
  position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,#201e1d 55%,transparent);padding:20px;
}
.overlay .box{background:var(--color-bg);padding:20px;max-width:min(440px,94vw);width:100%;box-shadow:var(--shadow-lg)}

.spin{
  width:18px;height:18px;border:2px solid var(--color-bg);border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;
}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<style>
  #top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:2px solid var(--color-divider);
       position:sticky;top:0;background:var(--color-bg);z-index:20}
  #brand{font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:-.02em;margin-right:auto}
  #tabs{display:flex;gap:0;padding:0 24px;border-bottom:2px solid var(--color-divider);
        position:sticky;top:57px;background:var(--color-bg);z-index:19;overflow-x:auto}
  #tabs button{padding:12px 18px;border:0;background:transparent;cursor:pointer;white-space:nowrap;
       font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-text);
       border-bottom:3px solid transparent;margin-bottom:-2px}
  #tabs button.on{color:var(--color-accent);border-bottom-color:var(--color-accent)}
  #view{padding:24px;max-width:1400px;margin:0 auto}
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px}
  .group{border:2px solid var(--color-divider);margin-bottom:18px}
  .group > h4{margin:0;padding:12px 14px;background:var(--color-surface);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .group > .in{padding:14px}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .shots figure img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--color-surface)}
  .wrap{overflow-x:auto}
  #gate,#boot{max-width:420px;margin:12vh auto;padding:24px;border:2px solid var(--color-text)}
  #boot-bar{height:4px;background:var(--color-divider);margin-top:16px;overflow:hidden}
  #boot-bar i{display:block;height:100%;width:38%;background:var(--color-accent);
       animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
  #btn-reload-icon.spin{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- จอคั่นตอนกำลังเข้าระบบด้วยรหัสที่จำไว้ — ไม่ต้องเห็นหน้าใส่รหัสวูบหนึ่งทุกครั้งที่รีเฟรช -->
<div id="boot" class="hide">

  <p style="font-size:13px;opacity:.75">ใส่รหัสพนักงานที่มีบทบาท "แอดมิน" หรือ "หัวหน้างาน" ในชีททะเบียนพนักงาน</p>

  <div id="tabs"></div>

<script>
window.API_URL   = 'https://script.google.com/macros/s/AKfycbzyDZ_cZ6FxLz9OSmeOr4KOTPq0qX2kZesGQU8lvwbj3Il38KR-UGmvp4SQkoLSiX-H/exec';
window.ADMIN_URL = './admin.html';
var WEBAPP_URL   = './';
</script>
<!-- ===== js-common.html ===== -->
<script>
/* ══════════════════════════════════════════════════════════════════════
   js-common — ตัวช่วยที่ทั้งแอพมือถือและเว็บแอดมินใช้ร่วมกัน
   ══════════════════════════════════════════════════════════════════ */

/**
 * เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์แบบ Promise
 *
 * หน้านี้รันได้ 2 ที่ โค้ดชุดเดียวกัน:
 *   · เสิร์ฟจาก Apps Script  → ใช้ google.script.run (เร็วกว่า ไม่ต้องข้ามโดเมน)
 *   · เสิร์ฟจาก GitHub Pages → ใช้ fetch ยิงไปที่ doPost ของ Apps Script
 */
var API_URL = window.API_URL || '';
function useFetch() {
  return !(typeof google !== 'undefined' && google.script && google.script.run);
}

function rpc(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return useFetch() ? rpcFetch(name, args) : rpcNative(name, args);
}

function rpcNative(name, args) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok === false) reject(new Error(res.error || 'ทำรายการไม่สำเร็จ'));
        else resolve(res);
      })
      .withFailureHandler(function (e) {
        reject(new Error((e && e.message) ? e.message : 'ติดต่อเซิร์ฟเวอร์ไม่ได้'));
      })[name].apply(null, args);
  });
}

/**
 * เวลารอสูงสุดต่อ 1 คำขอ
 *
 * ไม่ใส่ไว้ = fetch รอจนกว่าเบราว์เซอร์จะยอมแพ้เอง ซึ่งนานเป็นนาที
 * พนักงานเห็นแต่ปุ่มหมุน ๆ ไม่รู้ว่าเกิดอะไรขึ้น กดซ้ำก็ไม่ได้
 * ครบเวลาแล้วตัดเลย ให้ชั้นบนเก็บงานเข้าคิวไปส่งใหม่ทีหลัง
 */
var RPC_TIMEOUT_MS = 25000;
var RPC_TIMEOUT_UPLOAD_MS = 60000;   // รูป 1 ใบราว 150 KB เน็ตหน้างานช้าต้องให้เวลามากกว่า

function rpcTimeout(name) {
  return name === 'apiUploadPhoto' ? RPC_TIMEOUT_UPLOAD_MS : RPC_TIMEOUT_MS;
}

function rpcFetch(name, args) {
  if (!API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL'));
  // ส่งเป็น text/plain เพื่อให้เป็น "simple request" เบราว์เซอร์จะได้ไม่ยิง preflight
  // (Apps Script ตอบ OPTIONS ไม่ได้)
  var body = JSON.stringify({ fn: name, args: args });
  var ms = rpcTimeout(name);
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var late = false;
  var timer = setTimeout(function () { late = true; if (ctl) ctl.abort(); }, ms);
  var stop = function () { clearTimeout(timer); };

  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: body,
    redirect: 'follow',
    signal: ctl ? ctl.signal : undefined,
    // ให้คำขอวิ่งต่อแม้ผู้ใช้ปิดแท็บไปแล้ว (เบราว์เซอร์จำกัดขนาดไว้ที่ 64KB)
    // ใช้กับงานที่กดแล้วไม่ต้องรอ เช่น ลบรูป — ปิดหน้าเว็บทันทีของก็ยังถูกลบ
    keepalive: body.length < 60000
  }).catch(function () {
    // ข้อความต้องมีคำว่า "เซิร์ฟเวอร์" เสมอ — ชั้นบนใช้คำนี้ตัดสินว่าควรเก็บเข้าคิว
    throw new Error(late
      ? 'เซิร์ฟเวอร์ไม่ตอบใน ' + Math.round(ms / 1000) + ' วินาที'
      : 'ติดต่อเซิร์ฟเวอร์ไม่ได้');
  }).then(function (r) {
    if (!r.ok) throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด (' + r.status + ')');
    return r.text();
  }).then(function (t) {
    var res;
    try { res = JSON.parse(t); }
    catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกรูปแบบ'); }
    if (res && res.ok === false) throw new Error(res.error || 'ทำรายการไม่สำเร็จ');
    return res;
  }).then(function (v) { stop(); return v; },
          function (e) { stop(); throw e; });
}

var $  = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

function el(tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'style') n.style.cssText = attrs[k];
    else if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var _toastTimer = null;
function toast(msg, isErr, ms) {
  var old = $('.toast'); if (old) old.remove();
  var t = el('div', { class: 'toast' + (isErr ? ' err' : '') }, [String(msg)]);
  document.body.appendChild(t);
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { t.remove(); }, ms || (isErr ? 6000 : 3200));
}

var store = {
  get: function (k, d) { try { var v = localStorage.getItem('ppr.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('ppr.' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('ppr.' + k); } catch (e) {} }
};

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function nowParts() {
  var d = new Date();
  return {
    date: pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(),
    time: pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()),
    hhmm: pad2(d.getHours()) + ':' + pad2(d.getMinutes())
  };
}

function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ── ตำแหน่ง GPS ────────────────────────────────────────────────────── */

var geo = {
  last: null,
  watchId: null,
  start: function () {
    if (!navigator.geolocation || this.watchId !== null) return;
    var self = this;
    this.watchId = navigator.geolocation.watchPosition(
      function (p) { self.last = p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5); },
      function () { /* ผู้ใช้ไม่อนุญาต — ปล่อยให้เป็น null */ },
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 15000 }
    );
  },
  text: function () { return this.last || ''; }
};

/* ── ย่อรูป + ประทับวันเวลา/พิกัด/รหัสเครื่องลงบนภาพ ────────────────── */

// ตั้งไว้ประหยัดพื้นที่ Drive: ~100 KB/รูป (จากเดิม 1400px/0.72 = ~280 KB)
// ยังอ่านรหัสเครื่องและเห็นสภาพเครื่องชัด ถ้าอยากได้ละเอียดกว่านี้ค่อยขยับขึ้น
var MAX_EDGE = 1000;   // ด้านยาวสุดหลังย่อ
var JPEG_Q   = 0.6;

/**
 * @param {File|Blob} file
 * @param {string[]} lines  ข้อความที่จะประทับ (บรรทัดบนสุดคือบรรทัดแรก)
 * @returns {Promise<string>} data URL
 */
function stampPhoto(file, lines) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var sc = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
        var w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var x = c.getContext('2d');
        x.drawImage(img, 0, 0, w, h);

        var txt = (lines || []).filter(Boolean);
        if (txt.length) {
          var fs = Math.max(13, Math.round(w * 0.028));
          var pad = Math.round(fs * 0.55);
          var lh = Math.round(fs * 1.38);
          var boxH = lh * txt.length + pad * 2;

          x.fillStyle = 'rgba(0,0,0,0.58)';
          x.fillRect(0, h - boxH, w, boxH);
          x.fillStyle = '#ffffff';
          x.font = '600 ' + fs + 'px "IBM Plex Sans Thai", Archivo, sans-serif';
          x.textBaseline = 'top';
          txt.forEach(function (line, i) {
            x.fillText(line, pad, h - boxH + pad + i * lh, w - pad * 2);
          });

          // แถบสีแบรนด์ด้านซ้าย เพื่อให้เห็นชัดว่าเป็นรูปจากระบบ
          x.fillStyle = '#ec3013';
          x.fillRect(0, h - boxH, Math.max(3, Math.round(w * 0.008)), boxH);
        }
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', JPEG_Q));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('เปิดไฟล์รูปไม่ได้')); };
    img.src = url;
  });
}

/* ── คิวออฟไลน์ (IndexedDB — localStorage เล็กเกินไปสำหรับรูป) ───────── */

var Q = {
  db: null,
  open: function () {
    var self = this;
    if (self.db) return Promise.resolve(self.db);
    return new Promise(function (resolve, reject) {
      var rq = indexedDB.open('ppr-queue', 3);
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains('jobs')) db.createObjectStore('jobs', { keyPath: 'clientId' });
        // งานที่ทำค้างไว้ (ยังไม่กดส่ง) — Android มักฆ่าหน้าเว็บทิ้งตอนเปิดกล้อง
        // เก็บไว้ที่นี่เพื่อกู้กลับมาให้ถ่ายต่อจากจุดเดิมได้
        if (!db.objectStoreNames.contains('draft')) db.createObjectStore('draft');
        // รูปของรายการที่ปิดไปแล้วแต่ยังอัปไม่ขึ้น — ต้องอยู่รอดข้ามการปิดแอพ
        // ไม่งั้นปิดแอพแล้วรูปหายทั้งที่แถวลงชีทไปแล้ว = หลักฐานขาดโดยไม่มีใครรู้
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
      };
      rq.onsuccess = function () { self.db = rq.result; resolve(self.db); };
      rq.onerror = function () { reject(rq.error); };
    });
  },
  tx: function (mode, fn, store) {
    var name = store || 'jobs';
    return this.open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(name, mode);
        var out = fn(t.objectStore(name));
        t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { reject(t.error); };
      });
    });
  },

  // ── งานที่ทำค้างไว้ ────────────────────────────────────────────────
  putDraft: function (d) { return this.tx('readwrite', function (s) { return s.put(d, 'current'); }, 'draft'); },
  getDraft: function ()  { return this.tx('readonly',  function (s) { return s.get('current'); }, 'draft'); },
  delDraft: function ()  { return this.tx('readwrite', function (s) { return s.delete('current'); }, 'draft'); },
  put:  function (job) { return this.tx('readwrite', function (s) { return s.put(job); }); },
  del:  function (id)  { return this.tx('readwrite', function (s) { return s.delete(id); }); },
  all:  function ()    { return this.tx('readonly',  function (s) { return s.getAll(); }); },
  count:function ()    { return this.all().then(function (a) { return a.length; }); },

  // ── รูปที่ตามส่งทีหลัง (รายการปิดไปแล้ว) ───────────────────────────
  pPut: function (p)  { return this.tx('readwrite', function (s) { return s.put(p); }, 'photos'); },
  pDel: function (id) { return this.tx('readwrite', function (s) { return s.delete(id); }, 'photos'); },
  pAll: function ()   { return this.tx('readonly',  function (s) { return s.getAll(); }, 'photos'); },
  pCount: function () { return this.pAll().then(function (a) { return a.length; }); }
};

/**
 * งานที่ส่งไปกี่ครั้งก็ไม่มีวันผ่าน — พักไว้ ไม่ต้องลองซ้ำวนไม่จบ
 *
 * จับเฉพาะข้อความที่เจาะจงจริง ๆ เท่านั้น
 * ของเดิมจับคำว่า "ไม่พบ" ลอย ๆ ซึ่งกินไปถึง "ไม่พบรหัสนี้ในชีททะเบียนพนักงาน"
 * และ "ไม่พบหัวข้อ" ด้วย — พวกนี้แค่ชีทยังไม่อัปเดต ส่งใหม่ทีหลังผ่านได้
 */
var QUEUE_STUCK = /ถูกคืนไปแล้ว|ปิดใช้งานอยู่|ถูกระงับการใช้งาน/;

/**
 * พยายามส่งทุกงานในคิว คืนจำนวนที่ส่งสำเร็จ
 *
 * กติกาเหล็ก: งานในคิว "ห้ามหายเงียบ" ไม่ว่ากรณีใด
 * ส่งไม่ผ่าน = ยังอยู่ในคิว พร้อมจดสาเหตุและจำนวนครั้งที่ลองไว้ให้เห็นบนหน้าจอ
 * ตัวที่ส่งไปก็ไม่มีวันผ่านจะติดธง stuck ไว้ ข้ามไปไม่ลองซ้ำ แต่ยังอยู่ในคิวเหมือนเดิม
 * ให้คนตัดสินใจลบเองจากหน้าคิว — ระบบไม่ลบให้เอง
 *
 * งานหนึ่งพังไม่ทำให้งานที่เหลือหยุดตาม (ของเดิม throw ทิ้งทั้งชุด)
 */
function flushQueue(onProgress) {
  return Q.all().then(function (jobs) {
    var live = jobs.filter(function (j) { return !j.stuck; });
    var sent = 0;
    return live.reduce(function (chain, job) {
      return chain.then(function () {
        if (onProgress) onProgress(job, sent, live.length);
        return rpc('apiSubmit', job.payload)
          .then(function () { sent++; return Q.del(job.clientId); })
          .catch(function (e) {
            var msg = (e && e.message) ? e.message : 'ส่งไม่สำเร็จ';
            job.tries = (job.tries || 0) + 1;
            job.err = msg;
            job.errAt = Date.now();
            if (QUEUE_STUCK.test(msg)) job.stuck = true;
            return Q.put(job);   // เก็บกลับเข้าคิวเสมอ ไม่ทิ้ง
          });
      });
    }, Promise.resolve()).then(function () { return sent; })
      .catch(function () { return sent; });
  });
}

/* ── รูปที่ตามส่งทีหลัง ───────────────────────────────────────────────── */

/**
 * เก็บรูปที่ยังอัปไม่ขึ้นไว้ส่งทีหลัง — เรียกตอนปิดรายการโดยรูปยังไม่ครบ
 * @param {Array} list  [{id, slot, dataUrl, time, gps}]
 */
function queuePhotos(empId, job, list) {
  return Promise.all((list || []).map(function (p) {
    return Q.pPut({
      id: p.id,
      empId: empId,
      recordId: job.recordId,
      folderId: job.folderId,
      slot: p.slot || '',
      dataUrl: p.dataUrl,
      time: p.time || '',
      gps: p.gps || '',
      at: Date.now(),
      tries: 0
    });
  }));
}

/**
 * พยายามส่งรูปที่ค้างทั้งหมด คืนจำนวนใบที่ส่งสำเร็จ
 *
 * ทำทีละรายการ (recordId) เพื่อให้บอกเซิร์ฟเวอร์ได้ว่า "ชุดนี้ครบแล้ว"
 * ป้าย "รอรูป" ในชีทจะเปลี่ยนเป็น "ส่งแล้ว" ก็ต่อเมื่อใบสุดท้ายของรายการนั้นขึ้นครบ
 *
 * รูปที่ยังส่งไม่ผ่านค้างอยู่ในคิวเหมือนเดิม ไม่ลบทิ้ง — กติกาเดียวกับคิวงาน
 */
function flushPhotos(onProgress) {
  if (!navigator.onLine) return Promise.resolve(0);

  return Q.pAll().then(function (all) {
    if (!all.length) return 0;

    var byRec = {};
    all.forEach(function (p) { (byRec[p.recordId] = byRec[p.recordId] || []).push(p); });

    var sent = 0, done = 0;
    return Object.keys(byRec).reduce(function (chain, rec) {
      return chain.then(function () {
        var list = byRec[rec], rows = [], okIds = [], failed = 0;

        return list.reduce(function (c2, p) {
          return c2.then(function () {
            if (onProgress) onProgress(++done, all.length);
            return rpc('apiUploadPhoto', p.empId, p.recordId, p.folderId,
                       p.slot, p.dataUrl, p.time, p.gps, 1)
              .then(function (row) { rows.push(row); okIds.push(p.id); })
              .catch(function (e) {
                failed++;
                p.tries = (p.tries || 0) + 1;
                p.err = (e && e.message) ? e.message : 'ส่งรูปไม่สำเร็จ';
                return Q.pPut(p);
              });
          });
        }, Promise.resolve()).then(function () {
          if (!rows.length) return;
          // ครบก็ต่อเมื่อใบที่เหลือของรายการนี้ไม่มีตัวไหนพลาดเลย
          return rpc('apiAddPhotos', list[0].empId, rec, rows, failed === 0)
            .then(function () {
              sent += rows.length;
              return Promise.all(okIds.map(function (id) { return Q.pDel(id); }));
            })
            .catch(function () { /* แปะไม่ผ่าน — คงไว้ในคิว ค่อยลองใหม่ */ });
        });
      });
    }, Promise.resolve()).then(function () { return sent; })
      .catch(function () { return sent; });
  });
}
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   js-admin — เว็บแอดมิน (ใช้บนคอมพิวเตอร์)
   ══════════════════════════════════════════════════════════════════ */

var A = {
  empId: store.get('adminId', ''),
  user: null, canEdit: false,
  master: null, pairs: [], records: [], openJobs: [], today: '',
  pendingPhotos: [],   // รายการที่ปิดแล้วแต่รูปยังมาไม่ครบ (ดูจากทั้งชีท ไม่ผูกกับช่วงที่เลือก)
  tab: 'vault',
  sel: {},          // ชุดรูปที่ติ๊กไว้เพื่อลบพร้อมกัน { รหัสรายการ: true }
  // ช่วงเวลาที่ดึงจากชีท — เริ่มที่ 7 วันล่าสุด ย้อนหลังกว่านั้นเลือกเดือน/ปีเอา
  // ถ้าดึงทั้งหมดทุกครั้ง ข้อมูลจะโตขึ้นทุกวันจนเปิดหน้าไม่ไหว
  range: { mode: 'days', n: 7 },
  periods: { months: [], years: [] },
  totalRecords: 0,
  fTopic: 'ทั้งหมด', fDate: 'ทั้งหมด', fSearch: '',
  fState: 'ทั้งหมด'       // ทั้งหมด · ยังไม่คืน · คืนแล้ว · มีปัญหา · แอดมินบันทึกให้
};

var STATES = ['ทั้งหมด', 'ยังไม่คืน', 'คืนแล้ว', 'มีปัญหา', 'แอดมินบันทึกให้'];

/**
 * ผ่านมากี่ชั่วโมงแล้วจากเวลาที่ชีทบันทึกไว้ ("d/M/yyyy, HH:mm:ss")
 * อ่านไม่ออกคืน null — ไม่เดา ไม่โชว์ตัวเลขมั่ว
 */
function hoursSince(ts) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})/.exec(String(ts || '').trim());
  if (!m) return null;
  var d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4]), Number(m[5]));
  var h = Math.floor((Date.now() - d.getTime()) / 3600000);
  return h < 0 ? 0 : h;
}

/** ชุดนี้ตรงกับตัวกรองสถานะที่เลือกไว้ไหม */
function stateMatch(p) {
  if (A.fState === 'ยังไม่คืน')      return !p.back;
  if (A.fState === 'คืนแล้ว')        return !!p.back;
  if (A.fState === 'มีปัญหา')        return p.status === 'มีปัญหา';
  if (A.fState === 'แอดมินบันทึกให้') return !!(p.out && p.out.by);
  return true;
}

/** ดร็อปดาวน์เลือกสถานะ — ใช้ร่วมกันทั้งคลังรูปและหน้าข้อมูล */
function stateSelect(onChange) {
  var s = h('select', { class: 'input', style: 'width:auto' }, STATES.map(function (n) {
    return h('option', { value: n, selected: n === A.fState ? 'selected' : null }, [n]);
  }));
  s.addEventListener('change', function (e) { A.fState = e.target.value; A.sel = {}; onChange(); });
  return s;
}

var TABS = [
  { id: 'vault',  label: 'คลังรูป' },
  { id: 'data',   label: 'ข้อมูล' },
  { id: 'dash',   label: 'แดชบอร์ด' },
  { id: 'topics', label: 'หัวข้อสำรวจ' },
  { id: 'rules',  label: 'เงื่อนไขถ่ายรูป' },
  { id: 'roster', label: 'ทะเบียนพนักงาน' },
  { id: 'assets', label: 'ทะเบียนอุปกรณ์' }
];

// ══ เข้าสู่ระบบ ═══════════════════════════════════════════════════════

function gateGo() {
  var pin = $('#gate-pin').value.trim();
  if (!pin) return;
  $('#gate-err').textContent = '';
  $('#gate-go').disabled = true;
  load(pin).then(function () {
    store.set('adminId', pin);
    enterApp();
  }).catch(function (e) {
    $('#gate-err').textContent = e.message;
  }).then(function () { $('#gate-go').disabled = false; });
}

function enterApp() {
  $('#boot').classList.add('hide');
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  renderAll();
  stampFresh();
}

/** ยอมแพ้แล้ว ให้ใส่รหัสเอง */
function showGate(msg) {
  $('#boot').classList.add('hide');
  $('#gate').classList.remove('hide');
  $('#gate-err').textContent = msg || '';
  $('#gate-go').disabled = false;
}

/**
 * โหลดข้อมูลใหม่แบบอยู่ที่เดิม — แท็บเดิม ตัวกรองเดิม เลื่อนค้างตรงไหนก็อยู่ตรงนั้น
 * เปลี่ยนแค่ข้อมูล ไม่ใช่การรีเฟรชทั้งหน้าเว็บ
 */
function reloadHere() {
  if (A.reloading) return;
  A.reloading = true;

  var icon = $('#btn-reload-icon');
  if (icon) icon.classList.add('spin');
  var y = window.scrollY;

  reload().then(function () {
    window.scrollTo(0, y);
    stampFresh();
    toast('ข้อมูลใหม่แล้ว');
  }).then(function () {
    A.reloading = false;
    if (icon) icon.classList.remove('spin');
  });
}

/**
 * เข้าระบบอัตโนมัติด้วยรหัสที่จำไว้
 *
 * ที่ผ่านมาถ้าเรียกเซิร์ฟเวอร์ไม่ผ่านแม้แต่ครั้งเดียว (Apps Script ตื่นช้า/เน็ตสะดุด)
 * จะเด้งไปหน้าล็อกอินทันที ทั้งที่รหัสยังถูกอยู่ — คราวนี้ลองใหม่ให้เองก่อน 3 ครั้ง
 * แล้วค่อยยอมแพ้ ถ้าเป็นเรื่องสิทธิ์จริง ๆ ค่อยเด้งไปหน้าล็อกอินตั้งแต่ครั้งแรก
 */
function bootAuto(tries) {
  tries = tries || 0;
  $('#boot-msg').textContent = tries
    ? 'เชื่อมต่อไม่ได้ กำลังลองใหม่ ' + tries + '/3…'
    : 'กำลังเข้าระบบ…';

  load(A.empId).then(enterApp).catch(function (e) {
    var temporary = /เซิร์ฟเวอร์|ติดต่อ|timeout|network|failed to fetch/i.test(e.message);
    if (temporary && tries < 3) {
      setTimeout(function () { bootAuto(tries + 1); }, 1500 * (tries + 1));
      return;
    }
    $('#gate-pin').value = A.empId;
    showGate(e.message);
  });
}

function load(empId) {
  return rpc('apiAdminLoad', empId, A.range).then(function (r) {
    A.empId = empId; A.user = r.user; A.canEdit = r.canEdit;
    A.master = r.master; A.pairs = r.pairs; A.records = r.records;
    A.openJobs = r.openJobs; A.today = r.today;
    A.pendingPhotos = r.pendingPhotos || [];
    A.range = r.range; A.periods = r.periods; A.totalRecords = r.totalRecords;
  });
}

// ══ ป้ายบอกความสดของข้อมูล ═══════════════════════════════════════════
//
// จงใจไม่ดึงข้อมูลใหม่เองอัตโนมัติ เพราะ 2 เหตุผล
//   1. จอจะเปลี่ยนใต้มือตอนกำลังทำงานอยู่
//   2. เปิดค้างทั้งวันแล้วยิงทุกนาที กินโควตาเวลาทำงานของ Apps Script
//      วันละ ~24 นาที จาก 90 นาที ทั้งที่ไม่มีใครดู ถ้าโควตาหมดคนหน้างานส่งงานไม่ได้ด้วย
//
// แทนที่ด้วยการบอกให้ชัดว่าข้อมูลเก่าแค่ไหน แล้วให้กด "โหลดใหม่" เอาเอง
// นาฬิกาตัวนี้นับในเครื่องล้วน ๆ ไม่ได้เรียกเซิร์ฟเวอร์

var FRESH = { at: 0, timer: null };

function stampFresh() {
  FRESH.at = Date.now();
  paintFresh();
  clearInterval(FRESH.timer);
  FRESH.timer = setInterval(paintFresh, 30000);
}

function paintFresh() {
  var f = $('#fresh');
  if (!f || !FRESH.at) return;
  var d = new Date(FRESH.at);
  var p = function (v) { return (v < 10 ? '0' : '') + v; };
  var mins = Math.floor((Date.now() - FRESH.at) / 60000);
  var ago = mins < 1 ? 'เมื่อครู่นี้' : (mins < 60 ? mins + ' นาทีที่แล้ว'
    : Math.floor(mins / 60) + ' ชม.ที่แล้ว');

  f.textContent = 'ข้อมูล ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ' น.\n' + ago;
  // เกิน 10 นาทีเริ่มเตือนด้วยสี จะได้นึกออกว่าควรกดโหลดใหม่
  f.style.color = mins >= 10 ? 'var(--color-accent)' : '';
  f.style.opacity = mins >= 10 ? '1' : '.6';
}

/** เปลี่ยนช่วงเวลาแล้วดึงข้อมูลใหม่จากชีท (ไม่ได้กรองในเครื่อง เพราะไม่ได้โหลดมาทั้งหมด) */
function setRange(r) {
  A.range = r; A.sel = {}; A.fDate = 'ทั้งหมด';
  toast('กำลังโหลด…', false, 30000);
  return reload().then(function () { stampFresh(); toast(rangeText(A.range)); });
}

function rangeText(r) {
  if (!r) return '';
  if (r.mode === 'all')   return 'ทั้งหมดตั้งแต่วันแรก';
  if (r.mode === 'year')  return 'ทั้งปี ' + r.y;
  if (r.mode === 'month') return 'เดือน ' + r.m + '/' + r.y;
  if (r.mode === 'day')   return 'วันที่ ' + thaiDay(r.d);
  return r.n + ' วันล่าสุด';
}

/** 'YYYY-MM-DD' -> 'd/M/yyyy' และเติมคำว่าวันนี้/เมื่อวานให้ถ้าตรง */
function thaiDay(iso) {
  var g = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!g) return iso || '';
  var txt = Number(g[3]) + '/' + Number(g[2]) + '/' + g[1];
  if (iso === isoDay(0))  return txt + ' (วันนี้)';
  if (iso === isoDay(-1)) return txt + ' (เมื่อวาน)';
  return txt;
}

/** วันที่แบบ YYYY-MM-DD นับจากวันนี้ (0 = วันนี้, -1 = เมื่อวาน) */
function isoDay(offset) {
  var d = new Date();
  d.setDate(d.getDate() + (offset || 0));
  var p = function (v) { return (v < 10 ? '0' : '') + v; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/** แถบเลือกช่วงเวลา — ใช้ร่วมกันทั้งหน้าคลังรูปและหน้าข้อมูล */
function rangeBar() {
  var r = A.range || { mode: 'days', n: 7 };
  var p = A.periods || { months: [], years: [] };
  var TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  // ปุ่มลัดวันเดียว — ปกติทำงานย้อนหลัง 1 วัน เลยให้ "เมื่อวาน" กดถึงในคลิกเดียว
  var isDay = function (iso) { return r.mode === 'day' && r.d === iso; };

  var bToday = h('button', { class: 'btn ' + (isDay(isoDay(0)) ? 'btn-primary' : 'btn-secondary') }, ['วันนี้']);
  bToday.addEventListener('click', function () { setRange({ mode: 'day', d: isoDay(0) }); });

  var bYest = h('button', { class: 'btn ' + (isDay(isoDay(-1)) ? 'btn-primary' : 'btn-secondary') }, ['เมื่อวาน']);
  bYest.addEventListener('click', function () { setRange({ mode: 'day', d: isoDay(-1) }); });

  // จิ้มเลือกวันจากปฏิทินได้ตรง ๆ ไม่ต้องไล่หาจากเดือน/ปี
  var pick = h('input', {
    type: 'date', class: 'input', style: 'width:auto',
    max: isoDay(0),
    value: r.mode === 'day' ? r.d : ''
  }, []);
  pick.addEventListener('change', function (e) {
    if (e.target.value) setRange({ mode: 'day', d: e.target.value });
  });

  var d7 = h('button', { class: 'btn ' + (r.mode === 'days' ? 'btn-primary' : 'btn-secondary') }, ['7 วันล่าสุด']);
  d7.addEventListener('click', function () { setRange({ mode: 'days', n: 7 }); });

  var selM = h('select', { class: 'input', style: 'width:auto' },
    [h('option', { value: '' }, ['เลือกเดือน'])].concat(p.months.map(function (k) {
      var y = Number(k.slice(0, 4)), m = Number(k.slice(5));
      var on = r.mode === 'month' && r.y === y && r.m === m;
      return h('option', { value: k, selected: on ? 'selected' : null }, [TH[m - 1] + ' ' + y]);
    })));
  selM.addEventListener('change', function (e) {
    if (!e.target.value) return;
    setRange({ mode: 'month', y: Number(e.target.value.slice(0, 4)), m: Number(e.target.value.slice(5)) });
  });

  var selY = h('select', { class: 'input', style: 'width:auto' },
    [h('option', { value: '' }, ['เลือกปี'])].concat(p.years.map(function (y) {
      return h('option', { value: y, selected: (r.mode === 'year' && r.y === Number(y)) ? 'selected' : null }, [y]);
    })));
  selY.addEventListener('change', function (e) {
    if (e.target.value) setRange({ mode: 'year', y: Number(e.target.value) });
  });

  var all = h('button', { class: 'btn ' + (r.mode === 'all' ? 'btn-primary' : 'btn-secondary'), style: 'font-size:12px' }, ['ทั้งหมด']);
  all.addEventListener('click', function () {
    if (!confirm('โหลดข้อมูลทั้งหมดตั้งแต่วันแรก?\n\nถ้าเก็บมานานจะใช้เวลาโหลดพอสมควร\nปกติเลือกเดือนหรือปีจะเร็วกว่ามาก')) return;
    setRange({ mode: 'all' });
  });

  return h('div', { class: 'bar', style: 'margin-bottom:10px' }, [
    h('span', { class: 'label' }, ['ช่วงเวลา']),
    bYest, bToday,
    h('div', {}, [h('span', { class: 'label' }, ['จิ้มเลือกวัน']), pick]),
    d7, selM, selY, all,
    h('div', { style: 'margin-left:auto;font-size:12px;opacity:.7' },
      ['กำลังดู ' + rangeText(r) + ' · ในชีทมีทั้งหมด ' + (A.totalRecords || 0) + ' แถว'])
  ]);
}

// ══ โครงหน้า ══════════════════════════════════════════════════════════

function renderAll() {
  $('#who').innerHTML = esc(A.user.name) + '<br><span class="muted">' +
    esc(A.user.id + ' · ' + A.user.role) + (A.canEdit ? '' : ' · ดูอย่างเดียว') + '</span>';

  var tb = $('#tabs');
  if (!tb.childNodes.length) {
    TABS.forEach(function (t) {
      var b = el('button', { 'data-tab': t.id }, [t.label]);
      b.addEventListener('click', function () { A.tab = t.id; renderAll(); });
      tb.appendChild(b);
    });
  }
  $$('#tabs button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-tab') === A.tab);
  });

  var v = $('#view'); v.innerHTML = '';

  // แถบเตือน "รูปยังไม่ครบ" ต้องเห็นทุกแท็บ ไม่ใช่เฉพาะตอนเปิดแดชบอร์ด
  // ไม่งั้นของค้างจะนอนอยู่เงียบ ๆ จนกว่าจะมีคนบังเอิญไปเปิดเจอ
  var np = (A.pendingPhotos || []).length;
  if (np && A.tab !== 'dash') {
    var goDash = el('button', { class: 'btn btn-secondary', style: 'font-size:12px;padding:4px 10px' }, ['ดูรายการ']);
    goDash.addEventListener('click', function () { A.tab = 'dash'; renderAll(); });
    v.appendChild(h('div', {
      style: 'display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:16px;' +
             'background:var(--color-accent);color:var(--color-bg);font-size:13px;font-weight:600'
    }, [
      h('span', { style: 'flex:1' },
        ['🔴 มี ' + np + ' รายการที่บันทึกลงชีทแล้วแต่รูปยังส่งมาไม่ครบ']),
      goDash
    ]));
  }

  ({
    vault:  viewVault, data: viewData, dash: viewDash, topics: viewTopics,
    rules:  viewRules, roster: viewRoster, assets: viewAssets
  }[A.tab] || viewVault)(v);
}

function reload() {
  return load(A.empId).then(renderAll).catch(function (e) { toast(e.message, true); });
}

function saveThen(promise) {
  toast('กำลังบันทึก…');
  return promise.then(function (r) {
    if (r && r.master) A.master = r.master;
    return reload();
  }).then(function () { toast('บันทึกลงชีทแล้ว'); })
    .catch(function (e) { toast(e.message, true); });
}

function guardEdit() {
  if (!A.canEdit) { toast('บัญชีนี้ดูได้อย่างเดียว', true); return false; }
  return true;
}

function h(tag, attrs, kids) { return el(tag, attrs, kids); }
function section(title, kids, actions) {
  return h('div', { class: 'group' }, [
    h('h4', {}, [title].concat(actions || [])),
    h('div', { class: 'in' }, kids)
  ]);
}
function statCard(k, v, accent, jumpTo) {
  var n = h('div', { class: 'stat' }, [
    h('div', { class: 'v', style: accent ? 'color:var(--color-accent)' : '' }, [String(v)]),
    h('div', { class: 'k' }, [k])
  ]);
  // การ์ดที่กดแล้วกรองให้เลย — ทางลัดที่ใช้บ่อยสุดคือดูว่าตัวไหนยังไม่คืน
  if (jumpTo) {
    n.style.cursor = 'pointer';
    n.title = 'กดเพื่อกรองเฉพาะ ' + jumpTo;
    n.addEventListener('click', function () {
      A.fState = (A.fState === jumpTo) ? 'ทั้งหมด' : jumpTo;
      A.sel = {}; renderAll();
    });
  }
  return n;
}

// ══ คลังรูป ═══════════════════════════════════════════════════════════

/**
 * ค้นหาแบบพิมพ์อะไรก็เจอ — รหัสรายการ (เต็มหรือแค่เลขท้าย) รหัสเครื่อง
 * ชื่อคน แผนก หัวข้อ อาการ หมายเหตุ
 *
 * เทียบทั้งรหัสฝั่งเบิกและฝั่งคืน เพราะคนละรหัสกัน
 * พิมพ์ 1399 อย่างเดียวก็เจอ IDATA-20260810-1399
 */
function pairMatch(p, q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return true;
  var hay = [
    p.id, p.codes, p.name, p.dept, p.topic, p.date, p.issue, p.note,
    p.out && p.out.recordId, p.back && p.back.recordId,
    p.out && p.out.issue, p.back && p.back.issue,
    p.out && p.out.note, p.back && p.back.note,
    p.out && p.out.empName, p.back && p.back.empName
  ].filter(Boolean).join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

/**
 * เปิดคลังรูปแล้วค้นด้วยรหัสเครื่องให้เลย — ใช้จากปุ่ม "ดูรูป" ในทะเบียนอุปกรณ์
 * ล้างตัวกรองอื่นทิ้งก่อน ไม่งั้นอาจไม่เจอทั้งที่มีข้อมูล
 */
function seePhotosOf(code) {
  A.tab = 'vault';
  A.fSearch = code;
  A.fTopic = 'ทั้งหมด'; A.fDate = 'ทั้งหมด'; A.fState = 'ทั้งหมด';
  A.sel = {};
  renderAll();
  window.scrollTo(0, 0);
}

function viewVault(v) {
  var topics = A.master.topics;
  var dates = ['ทั้งหมด'].concat(A.pairs.map(function (p) { return p.date; })
    .filter(function (x, i, a) { return x && a.indexOf(x) === i; }));

  var list = A.pairs.filter(function (p) {
    if (A.fTopic !== 'ทั้งหมด' && p.topic !== A.fTopic) return false;
    if (A.fDate !== 'ทั้งหมด' && p.date !== A.fDate) return false;
    return pairMatch(p, A.fSearch);
  });

  var selTopic = h('select', { class: 'input', style: 'width:auto' },
    ['ทั้งหมด'].concat(topics.map(function (t) { return t.name; })).map(function (n) {
      return h('option', { value: n, selected: n === A.fTopic ? 'selected' : null }, [n]);
    }));
  selTopic.addEventListener('change', function (e) { A.fTopic = e.target.value; A.sel = {}; renderAll(); });

  var selDate = h('select', { class: 'input', style: 'width:auto' }, dates.map(function (n) {
    return h('option', { value: n, selected: n === A.fDate ? 'selected' : null }, [n]);
  }));
  selDate.addEventListener('change', function (e) { A.fDate = e.target.value; A.sel = {}; renderAll(); });

  // ค้นหา — พิมพ์เลขท้ายรหัสรายการ 4 ตัวก็พอ เช่น 1399
  var find = h('input', {
    class: 'input', style: 'width:250px', value: A.fSearch,
    placeholder: 'รหัสรายการ (เช่น 1399) / รหัสเครื่อง / ชื่อ'
  }, []);
  // วาดใหม่เฉพาะรายการ ไม่ใช่ทั้งหน้า ไม่งั้นเคอร์เซอร์หลุดออกจากช่องทุกตัวอักษร
  find.addEventListener('input', function (e) {
    A.fSearch = e.target.value; A.sel = {};
    fillVault();
  });

  var clear = h('button', { class: 'btn btn-secondary' }, ['ล้างตัวกรอง']);
  clear.addEventListener('click', function () {
    A.fTopic = 'ทั้งหมด'; A.fDate = 'ทั้งหมด'; A.fSearch = ''; A.fState = 'ทั้งหมด';
    A.sel = {}; renderAll();
  });

  v.appendChild(rangeBar());
  v.appendChild(h('div', { class: 'bar' }, [
    h('div', {}, [h('span', { class: 'label' }, ['ค้นหา']), find]),
    h('div', {}, [h('span', { class: 'label' }, ['สถานะ']), stateSelect(fillVault)]),
    h('div', {}, [h('span', { class: 'label' }, ['หัวข้อ']), selTopic]),
    h('div', {}, [h('span', { class: 'label' }, ['วันที่']), selDate]),
    clear,
    h('div', { id: 'vault-count', style: 'margin-left:auto;font-size:13px' }, [list.length + ' รายการ'])
  ]));

  v.appendChild(h('div', { id: 'vault-body' }, []));
  fillVault();
}

/** รายการที่ผ่านตัวกรองทั้งหมดของหน้าคลังรูป */
function vaultList() {
  return A.pairs.filter(function (p) {
    if (A.fTopic !== 'ทั้งหมด' && p.topic !== A.fTopic) return false;
    if (A.fDate !== 'ทั้งหมด' && p.date !== A.fDate) return false;
    if (!stateMatch(p)) return false;
    return pairMatch(p, A.fSearch);
  });
}

/** วาดเฉพาะส่วนรายการ — เรียกซ้ำได้โดยช่องค้นหาไม่เสียโฟกัส */
function fillVault() {
  var box = $('#vault-body');
  if (!box) return;
  box.innerHTML = '';
  var list = vaultList();

  var cnt = $('#vault-count');
  if (cnt) cnt.textContent = list.length + ' รายการ';

  // แถบซ่อนหลายรายการ — โผล่เมื่อติ๊กเลือกไว้ (ติ๊กเป็น "ชุด" เบิกกับคืนไปด้วยกัน)
  var ids = Object.keys(A.sel).filter(function (k) { return A.sel[k]; });
  if (ids.length) {
    var recIds = selectedRecordIds();
    var del = h('button', { class: 'btn btn-primary' },
      ['ซ่อนรูปที่เลือก ' + ids.length + ' ชุด (' + recIds.length + ' รายการ)']);
    del.addEventListener('click', function () { bulkHidePhotos(recIds, false); });
    var cancel = h('button', { class: 'btn btn-secondary' }, ['ยกเลิกที่เลือก']);
    cancel.addEventListener('click', function () { A.sel = {}; fillVault(); });
    box.appendChild(h('div', {
      style: 'position:sticky;top:110px;z-index:18;display:flex;gap:10px;align-items:center;' +
             'padding:10px 14px;margin-bottom:14px;background:var(--color-accent-100);' +
             'border-top:2px solid var(--color-accent)'
    }, [
      h('strong', { style: 'flex:1;font-size:13px' },
        ['เลือกไว้ ' + ids.length + ' ชุด · ซ่อนออกจากหน้าเว็บเฉย ๆ ไม่ได้ลบข้อมูลหรือไฟล์']),
      cancel, del
    ]));
  }

  // ติ๊กทั้งหมดที่เห็นอยู่
  if (A.canEdit && list.length) {
    var selAll = h('button', { class: 'btn btn-secondary', style: 'font-size:12px' }, ['เลือกทั้งหมดที่เห็น']);
    selAll.addEventListener('click', function () {
      list.forEach(function (p) { if (pairHasPhotos(p)) A.sel[p.id] = true; });
      fillVault();
    });
    box.appendChild(h('div', { style: 'margin-bottom:14px' }, [selAll]));
  }

  box.appendChild(h('div', { class: 'grid4', style: 'margin-bottom:22px' }, [
    statCard('เบิก', list.length),
    statCard('คืนแล้ว', list.filter(function (p) { return p.back; }).length, false, 'คืนแล้ว'),
    statCard('ยังไม่คืน', list.filter(function (p) { return !p.back; }).length, true, 'ยังไม่คืน'),
    statCard('พบปัญหา', list.filter(function (p) { return p.status === 'มีปัญหา'; }).length, true, 'มีปัญหา'),
    statCard('รูปบนเว็บ', list.reduce(function (a, p) {
      return a + sidePhotos(p.out).length + sidePhotos(p.back).length;
    }, 0))
  ]));

  if (!list.length) {
    box.appendChild(h('p', { class: 'muted' },
      [A.fSearch ? 'ไม่พบรายการที่ตรงกับ "' + A.fSearch + '" ในช่วง' + rangeText(A.range)
                 : 'ยังไม่มีรายการในช่วง' + rangeText(A.range)]));
    // ของที่หาอาจอยู่นอกช่วงเวลาที่เลือกไว้ ให้ทางลัดขยายไปหาทั้งหมด
    if (A.range && A.range.mode !== 'all') {
      var wide = h('button', { class: 'btn btn-primary', style: 'font-size:12px' }, ['ค้นย้อนหลังทั้งหมด']);
      wide.addEventListener('click', function () { setRange({ mode: 'all' }); });
      box.appendChild(h('div', { style: 'margin-top:8px' }, [wide]));
    }
    return;
  }
  list.forEach(function (p) { box.appendChild(pairCard(p)); });
}

function sidePhotos(side) {
  return (side && !side.deleted && !side.hidden && side.photos) ? side.photos : [];
}

/** ชุดนี้ถูกซ่อนไว้ไหม (ฝั่งไหนฝั่งหนึ่งก็นับ) */
function pairHidden(p) {
  return !!((p.out && p.out.hidden) || (p.back && p.back.hidden));
}

/** ที่ติ๊กไว้เป็น "ชุด" — แปลงกลับเป็นรหัสรายการจริง ทั้งฝั่งเบิกและฝั่งคืน */
function selectedRecordIds() {
  var seen = {}, out = [];
  A.pairs.forEach(function (p) {
    if (!A.sel[p.id]) return;
    pairIds(p).forEach(function (id) {
      if (seen[id]) return;
      seen[id] = true;
      out.push(id);
    });
  });
  return out;
}

/**
 * ซ่อนรูปออกจากหน้าเว็บ — กดแล้วหายทันที ไม่ถาม ไม่ต้องรอ
 *
 * ไม่ลบอะไรทั้งสิ้น ข้อมูลและลิงก์ในชีทอยู่ครบ ไฟล์ในไดรฟ์อยู่ครบ
 * แค่ไม่ส่งรูปมาแสดงเท่านั้น กดผิดก็กด "เอากลับมาแสดง" ได้ทันที
 *
 * หน้าจอตัดออกก่อนเลย แล้วค่อยส่งคำสั่งไปเบื้องหลัง (keepalive ปิดแท็บก็ยังไปถึง)
 */
function bulkHidePhotos(ids, show) {
  if (!guardEdit()) return;
  if (!ids || !ids.length) return;

  var n = show ? unhideLocally(ids) : hideLocally(ids);
  A.sel = {};
  renderAll();
  toast(show ? 'เอากลับมาแสดงแล้ว' : 'ซ่อนแล้ว ' + n + ' รูป · ข้อมูลและไฟล์ยังอยู่ครบ');

  var batches = [];
  for (var i = 0; i < ids.length; i += 300) batches.push(ids.slice(i, i + 300));

  batches.forEach(function (b) {
    rpc('apiAdminHidePhotos', A.empId, b, !!show).then(function () {
      // เอากลับมาแสดงแต่ในเครื่องไม่มีรูปเก็บไว้ (เพิ่งเปิดหน้ามา) ต้องไปเอาจากชีท
      if (show && n === 0) reloadHere();
    }).catch(function (e) {
      // ทำไม่สำเร็จ เอากลับไปสภาพเดิมตามความจริง
      if (show) hideLocally(b); else unhideLocally(b);
      renderAll();
      toast('ทำรายการไม่สำเร็จ ' + b.length + ' ชุด: ' + e.message, true, 8000);
    });
  });
}

/** วนทุกฝั่ง (เบิก/คืน) ของรายการที่รหัสตรงกับที่ส่งมา */
function eachSide(ids, fn) {
  var hit = {};
  ids.forEach(function (id) { hit[id] = true; });
  A.pairs.forEach(function (p) {
    [p.out, p.back].forEach(function (sd) {
      if (sd && hit[sd.recordId]) fn(sd);
    });
  });
}

/**
 * ซ่อน/เอากลับมาแสดง ในข้อมูลที่ถืออยู่ — ให้จอเปลี่ยนทันทีโดยไม่ต้องรอเซิร์ฟเวอร์
 * เก็บรูปเดิมไว้ในเครื่องด้วย จะได้เอากลับมาแสดงได้ทันทีไม่ต้องโหลดใหม่
 */
function hideLocally(ids) {
  var n = 0;
  eachSide(ids, function (sd) {
    if (sd.hidden) return;
    n += (sd.photos || []).length;
    sd._shots = sd.photos;
    sd.hidden = true;
    sd.photos = [];
  });
  return n;
}

function unhideLocally(ids) {
  var n = 0;
  eachSide(ids, function (sd) {
    if (!sd.hidden) return;
    sd.hidden = false;
    if (sd._shots) { sd.photos = sd._shots; delete sd._shots; }
    n += (sd.photos || []).length;
  });
  return n;
}

/** รหัสรายการทั้งชุด — เบิกกับคืนถือเป็นชุดเดียวกัน ลบทีเดียวไปพร้อมกัน */
function pairIds(p) {
  var seen = {}, out = [];
  [p.out, p.back].forEach(function (sd) {
    if (!sd || !sd.recordId || seen[sd.recordId]) return;
    seen[sd.recordId] = true;
    out.push(sd.recordId);
  });
  return out;
}

/** ชุดนี้ยังมีรูปเหลือให้ลบไหม (ลบไปแล้วทั้งสองฝั่งก็ไม่ต้องโชว์ปุ่ม) */
function pairHasPhotos(p) {
  return sidePhotos(p.out).length > 0 || sidePhotos(p.back).length > 0;
}

/**
 * ป้ายรหัสรายการ — ตัวเดียวกับที่หน้างานเห็นบนมือถือตอนส่งสำเร็จ
 * กดแล้วเอาไปใส่ช่องค้นหาให้เลย เผื่ออยากดึงคู่เบิก-คืนของชุดนี้มาดู
 */
function recChip(id) {
  if (!id) return null;
  var b = h('button', {
    class: 'mono',
    title: 'กดเพื่อค้นหารหัสนี้',
    style: 'font-size:11.5px;padding:2px 7px;cursor:pointer;background:var(--color-surface);' +
           'border:1px solid var(--color-divider);color:var(--color-text);font-weight:600'
  }, [id]);
  b.addEventListener('click', function () {
    A.fSearch = id; A.sel = {};
    A.tab = 'vault';
    renderAll();
  });
  return b;
}

/**
 * การ์ดที่ซ่อนรูปแล้ว — ย่อเหลือบรรทัดเดียว ไม่กินที่
 *
 * ยังเห็นข้อมูลสำคัญครบ (รหัสเครื่อง คนเบิก วันที่ จำนวน อาการ)
 * แค่ไม่ต้องเปลืองพื้นที่กับกล่องรูปที่ไม่มีรูปให้ดูแล้ว
 */
function pairCardHidden(p) {
  var n = (p.out ? p.out.photoN || 0 : 0) + (p.back ? p.back.photoN || 0 : 0);
  var qty = 'เบิก ' + p.qty + ' → คืน ' + (p.back ? (p.qtyBack !== null ? p.qtyBack : p.qty) : '—');

  var row = h('div', {
    style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;' +
           'padding:7px 12px;margin-bottom:6px;border:1px solid var(--color-divider);opacity:.65'
  }, [
    h('span', { style: 'font-weight:700' }, [p.codes || p.id]),
    recChip(p.id),
    h('span', { class: 'muted' }, [p.name + ' · ' + p.date]),
    h('span', { class: 'muted' }, [qty]),
    p.status === 'มีปัญหา'
      ? h('span', { class: 'tag tag-issue', style: 'font-size:11px' }, ['มีปัญหา' + (p.issue ? ': ' + p.issue : '')])
      : null,
    p.note ? h('span', { class: 'muted' }, ['หมายเหตุ: ' + p.note]) : null,
    h('span', { class: 'muted', style: 'margin-left:auto' }, ['ซ่อนไว้ ' + n + ' รูป'])
  ]);

  if (A.canEdit) {
    var back = h('button', { class: 'btn btn-secondary', style: 'font-size:11px;padding:3px 9px' }, ['↩ เอากลับมาแสดง']);
    back.addEventListener('click', function () { bulkHidePhotos(pairIds(p), true); });
    row.appendChild(back);
  }
  return row;
}

function pairCard(p) {
  if (pairHidden(p)) return pairCardHidden(p);

  var mismatch = !p.back || (p.qtyBack !== null && p.qtyBack !== p.qty);
  var head = h('h4', {}, [
    h('span', { style: 'font-size:16px' }, [p.codes || p.id]),
    // รหัสรายการ — แอดมินใช้อ้างอิงกับที่หน้างานเห็นบนมือถือ ค้นหาด้วยเลขท้ายได้
    recChip(p.id),
    h('span', { class: 'muted', style: 'font-size:12px;font-weight:400' },
      [p.name + ' · ' + p.dept + ' · ' + p.date + ' · ' + p.shift]),
    h('span', {
      class: 'tag' + (p.status === 'มีปัญหา' ? ' tag-issue' : ''),
      style: 'margin-left:auto'
    }, [p.status || '—']),
    h('span', {
      style: 'font-size:12px;font-weight:600;padding:3px 9px;' +
        (mismatch ? 'background:var(--color-accent);color:var(--color-bg)' : 'background:var(--color-surface)')
    }, ['เบิก ' + p.qty + ' เครื่อง → คืน ' + (p.back ? (p.qtyBack !== null ? p.qtyBack : p.qty) + ' เครื่อง' : 'ยังไม่คืน')])
  ]);

  // ── ติ๊ก/ซ่อน อยู่ที่หัวการ์ด ทำทีเดียวได้ทั้งเบิกและคืน ──
  var ids = pairIds(p);
  if (A.canEdit && pairHasPhotos(p)) {
    var nPhoto = sidePhotos(p.out).length + sidePhotos(p.back).length;
    var both = ids.length > 1 ? ' (เบิก+คืน)' : '';

    // ใช้ปุ่มแทน checkbox ใน <label> เพราะคลิกทีเดียวมันสลับสองรอบ กลายเป็นไม่ติ๊ก
    var on = !!A.sel[p.id];
    var tick = h('button', { class: 'chip' + (on ? ' on' : '') }, [(on ? '☑ ' : '☐ ') + 'เลือกซ่อน']);
    tick.addEventListener('click', function () {
      if (A.sel[p.id]) delete A.sel[p.id]; else A.sel[p.id] = true;
      fillVault();
    });
    head.appendChild(tick);

    var hd = h('button', { class: 'btn btn-secondary', style: 'font-size:12px' },
      ['ซ่อนรูปทั้งชุด' + both + ' · ' + nPhoto + ' รูป']);
    hd.addEventListener('click', function () { bulkHidePhotos(ids, false); });
    head.appendChild(hd);
  }

  var inner = h('div', { class: 'in' }, []);

  [['เบิก', p.out], ['คืน', p.back]].forEach(function (pair) {
    var label = pair[0], side = pair[1];
    var box = h('div', { style: 'margin-bottom:14px' }, []);
    var title = h('div', {
      style: 'display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--color-divider);padding-bottom:6px;margin-bottom:10px'
    }, [
      h('strong', { style: 'font-family:var(--font-heading);font-size:14px' }, [label]),
      side ? recChip(side.recordId) : null,
      side && side.result
        ? h('span', { class: 'tag' + (side.result === 'มีปัญหา' ? ' tag-issue' : ''), style: 'font-size:11px' }, [side.result])
        : null,
      h('span', { class: 'muted', style: 'font-size:12px' }, [
        side ? (side.time + ' น. · ' + (side.deleted ? 'ลบรูปแล้ว'
                : side.hidden ? 'ซ่อนไว้ ' + side.photoN + ' รูป'
                : sidePhotos(side).length + ' รูป')) : 'ยังไม่คืน'
      ]),
      side && side.empName
        ? h('span', { class: 'muted', style: 'font-size:12px' }, ['โดย ' + side.empName])
        : null,
      side && side.by
        ? h('span', { class: 'tag', style: 'font-size:11px' }, ['แอดมินบันทึกให้ · ' + side.by])
        : null
    ]);
    if (side && side.folder && !side.deleted) {
      title.appendChild(h('a', { href: side.folder, target: '_blank', rel: 'noopener',
        class: 'btn btn-ghost', style: 'margin-left:auto;font-size:12px' }, ['เปิดโฟลเดอร์ Drive']));
    }
    box.appendChild(title);

    // อาการและหมายเหตุของ "ฝั่งนี้" โดยเฉพาะ — เบิกกับคืนคนละคนคนละเวลา
    // ต้องแยกให้ชัด ไม่งั้นไม่รู้ว่าเสียตั้งแต่ตอนเบิกหรือมาเสียตอนคืน
    if (side && (side.issue || side.note)) {
      box.appendChild(h('div', {
        style: 'border-left:3px solid ' + (side.issue ? 'var(--color-accent)' : 'var(--color-divider)') +
               ';padding:6px 0 6px 10px;margin-bottom:10px;font-size:13px;line-height:1.5'
      }, [
        side.issue ? h('div', {}, [h('strong', {}, ['อาการ: ']), side.issue]) : null,
        side.note ? h('div', { class: 'muted', style: 'font-size:12px' }, ['หมายเหตุ: ' + side.note]) : null
      ]));
    }

    var shots = sidePhotos(side);
    if (!side) box.appendChild(h('p', { class: 'muted', style: 'font-size:13px' }, ['ยังไม่มีการคืน']));
    else if (side.deleted) {
      box.appendChild(h('p', { class: 'muted', style: 'font-size:13px' },
        ['ลบรูปแล้วเพื่อคืนพื้นที่ — เคยมี ' + side.photoN + ' รูป ลิงก์ยังอยู่ในชีท "รูปภาพ"']));
    }
    else if (side.hidden) {
      box.appendChild(h('p', { class: 'muted', style: 'font-size:13px' },
        ['ซ่อนไว้ ' + side.photoN + ' รูป — ไม่ได้ลบอะไรเลย ข้อมูลและลิงก์ในชีทอยู่ครบ ' +
         'ไฟล์ในไดรฟ์อยู่ครบ กด "เอากลับมาแสดง" ได้ตลอด']));
    }
    else if (!shots.length) box.appendChild(h('p', { class: 'muted', style: 'font-size:13px' }, ['ไม่มีรูปในชีท']));
    else {
      box.appendChild(h('div', { class: 'shots' }, shots.map(function (ph) {
        return h('figure', {}, [
          h('a', { href: ph.url, target: '_blank', rel: 'noopener' }, [
            h('img', { src: driveThumb(ph.url), loading: 'lazy', alt: ph.slot })
          ]),
          h('figcaption', { style: 'font-size:11px;margin-top:4px' }, [ph.slot + ' · ' + ph.time])
        ]);
      })));
    }
    inner.appendChild(box);
  });

  return h('div', { class: 'group' }, [head, inner]);
}

/** ลิงก์รูปย่อของ Drive — เร็วกว่าโหลดไฟล์เต็ม */
function driveThumb(url) {
  var m = /[-\w]{25,}/.exec(url || '');
  return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w400' : '';
}

// ══ ตารางข้อมูล ═══════════════════════════════════════════════════════

function viewData(v) {
  var dates = ['ทั้งหมด'].concat(A.pairs.map(function (p) { return p.date; })
    .filter(function (x, i, a) { return x && a.indexOf(x) === i; }));

  var selT = h('select', { class: 'input', style: 'width:auto' },
    ['ทั้งหมด'].concat(A.master.topics.map(function (t) { return t.name; })).map(function (n) {
      return h('option', { value: n, selected: n === A.fTopic ? 'selected' : null }, [n]);
    }));
  selT.addEventListener('change', function (e) { A.fTopic = e.target.value; renderAll(); });

  var selD = h('select', { class: 'input', style: 'width:auto' }, dates.map(function (n) {
    return h('option', { value: n, selected: n === A.fDate ? 'selected' : null }, [n]);
  }));
  selD.addEventListener('change', function (e) { A.fDate = e.target.value; renderAll(); });

  var inp = h('input', { class: 'input', style: 'width:220px', value: A.fSearch, placeholder: 'ค้นหา รหัสเครื่อง / ชื่อ / แผนก' });
  inp.addEventListener('input', function (e) {
    A.fSearch = e.target.value;
    var t = $('#data-body'); if (t) fillDataRows(t);
    var c = $('#data-count'); if (c) c.textContent = filtered().length + ' รายการ';
  });

  var clear = h('button', { class: 'btn btn-secondary' }, ['ล้างตัวกรอง']);
  clear.addEventListener('click', function () {
    A.fTopic = 'ทั้งหมด'; A.fDate = 'ทั้งหมด'; A.fSearch = ''; A.fState = 'ทั้งหมด'; renderAll();
  });

  var csv = h('button', { class: 'btn btn-secondary' }, ['ดาวน์โหลด CSV']);
  csv.addEventListener('click', exportCsv);

  v.appendChild(rangeBar());
  v.appendChild(h('div', { class: 'bar' }, [
    h('div', {}, [h('span', { class: 'label' }, ['สถานะ']), stateSelect(renderAll)]),
    h('div', {}, [h('span', { class: 'label' }, ['หัวข้อ']), selT]),
    h('div', {}, [h('span', { class: 'label' }, ['วันที่']), selD]),
    h('div', {}, [h('span', { class: 'label' }, ['ค้นหา']), inp]),
    clear, csv,
    h('div', { id: 'data-count', style: 'margin-left:auto;font-size:13px' }, [filtered().length + ' รายการ'])
  ]));

  var f = filtered();
  v.appendChild(h('div', { class: 'grid4', style: 'margin-bottom:18px' }, [
    statCard('รายการที่กรอง', f.length),
    statCard('คืนแล้ว', f.filter(function (p) { return p.back; }).length, false, 'คืนแล้ว'),
    statCard('ยังไม่คืน', f.filter(function (p) { return !p.back; }).length, true, 'ยังไม่คืน'),
    statCard('พบปัญหา', f.filter(function (p) { return p.status === 'มีปัญหา'; }).length, true, 'มีปัญหา')
  ]));

  var body = h('tbody', { id: 'data-body' }, []);
  v.appendChild(h('div', { class: 'wrap' }, [
    h('table', { class: 'table' }, [
      // แยกอาการ/หมายเหตุ ตอนเบิก กับ ตอนคืน คนละคอลัมน์
      // เพราะเป็นคนละคนคนละเวลา รวมกันแล้วอ่านไม่ออกว่าใครแจ้งอะไร
      h('thead', {}, [h('tr', {}, ['รหัสรายการ', 'วันที่', 'กะ', 'ผู้เบิก', 'แผนก', 'หัวข้อ', 'จำนวน', 'รหัสเครื่อง',
        'เบิก', 'ดำเนินการโดย', 'ผลตรวจตอนเบิก', 'อาการตอนเบิก', 'หมายเหตุตอนเบิก',
        'คืน', 'ผลตรวจตอนคืน', 'อาการตอนคืน', 'หมายเหตุตอนคืน'].map(function (t) { return h('th', {}, [t]); }))]),
      body
    ])
  ]));
  fillDataRows(body);
}

function filtered() {
  // ใช้ตัวค้นหาและตัวกรองสถานะชุดเดียวกับหน้าคลังรูป
  return A.pairs.filter(function (p) {
    if (A.fTopic !== 'ทั้งหมด' && p.topic !== A.fTopic) return false;
    if (A.fDate !== 'ทั้งหมด' && p.date !== A.fDate) return false;
    if (!stateMatch(p)) return false;
    return pairMatch(p, A.fSearch);
  });
}

function fillDataRows(tbody) {
  tbody.innerHTML = '';
  filtered().forEach(function (p) {
    tbody.appendChild(h('tr', {}, [
      h('td', { style: 'font-family:var(--font-heading);font-weight:800;font-size:12px' }, [p.id]),
      h('td', {}, [p.date]), h('td', { style: 'font-size:12px' }, [p.shift]),
      h('td', {}, [p.name]), h('td', {}, [p.dept]), h('td', {}, [p.topic]),
      h('td', {}, [String(p.qty) + (p.qtyBack !== null && p.qtyBack !== p.qty ? ' → ' + p.qtyBack : '')]),
      h('td', { style: 'font-size:12px' }, [p.codes]),
      h('td', {}, [p.out ? p.out.time + ' (' + sidePhotos(p.out).length + ')' : '—']),
      textCell(p.out && p.out.by),
      resultCell(p.out), textCell(p.out && p.out.issue), textCell(p.out && p.out.note),
      h('td', { style: p.back ? '' : 'color:var(--color-accent);font-weight:600' },
        [p.back ? p.back.time + ' (' + sidePhotos(p.back).length + ')' : 'ยังไม่คืน']),
      resultCell(p.back), textCell(p.back && p.back.issue), textCell(p.back && p.back.note)
    ]));
  });
}

function resultCell(side) {
  if (!side || !side.result) return h('td', { class: 'muted' }, ['—']);
  return h('td', {}, [h('span', { class: 'tag' + (side.result === 'มีปัญหา' ? ' tag-issue' : '') }, [side.result])]);
}

function textCell(txt) {
  return h('td', { style: 'font-size:12px;max-width:200px' }, [txt || '—']);
}

function exportCsv() {
  var head = ['รหัสรายการเบิก', 'รหัสรายการคืน', 'วันที่', 'กะ', 'รหัสพนักงาน', 'ผู้เบิก', 'แผนก', 'หัวข้อ',
    'จำนวนเบิก', 'จำนวนคืน', 'รหัสเครื่อง',
    'เวลาเบิก', 'รูปเบิก', 'ดำเนินการโดย', 'ผลตรวจตอนเบิก', 'อาการตอนเบิก', 'หมายเหตุตอนเบิก',
    'เวลาคืน', 'รูปคืน', 'ผู้คืน', 'ผลตรวจตอนคืน', 'อาการตอนคืน', 'หมายเหตุตอนคืน'];
  var g = function (side, k) { return (side && side[k]) || ''; };
  var rows = filtered().map(function (p) {
    return [p.id, g(p.back, 'recordId'), p.date, p.shift, p.empId, p.name, p.dept, p.topic,
      p.qty, p.qtyBack === null ? '' : p.qtyBack, p.codes,
      g(p.out, 'time'), sidePhotos(p.out).length, g(p.out, 'by'),
      g(p.out, 'result'), g(p.out, 'issue'), g(p.out, 'note'),
      g(p.back, 'time'), sidePhotos(p.back).length, g(p.back, 'empName'),
      g(p.back, 'result'), g(p.back, 'issue'), g(p.back, 'note')];
  });
  var csv = [head].concat(rows).map(function (r) {
    return r.map(function (c) { return '"' + String(c === null || c === undefined ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'photo-report-' + A.today.replace(/\//g, '-') + '.csv';
  a.click();
}

function viewDash(v) {

          h('div', { style: 'height:12px;background:var(--color-text);width:' + Math.round(map[k] / max * 100) + '%' })
        ]),
        h('strong', { style: 'width:32px;text-align:right' }, [String(map[k])])
      ]);
    })));

  var issues = P.filter(function (p) { return p.status === 'มีปัญหา'; });
  v.appendChild(section('รายการที่พบปัญหา', issues.length ? issues.map(function (p) {
    return h('div', { style: 'border-top:2px solid var(--color-accent);padding:8px 0;margin-bottom:8px' }, [
      h('div', { style: 'font-family:var(--font-heading);font-weight:800;font-size:13px' },
        [p.date + ' · ' + p.codes + ' · ' + p.name]),
      h('div', { style: 'font-size:13px' }, [p.issue || '—']),
      h('div', { class: 'muted', style: 'font-size:12px' }, ['หมายเหตุ: ' + (p.note || '—')])
    ]);
  }) : [h('p', { class: 'muted' }, ['ไม่มี'])]));

  // ── รายการที่ปิดไปแล้วแต่รูปยังตามมาไม่ครบ ──────────────────────────
  //
  // แถวลงชีทแล้ว เครื่องไม่ล็อกค้าง งานเดินต่อได้ — ขาดแค่หลักฐาน
  // แอพจะตื๊อส่งเองและเตือนเจ้าตัวตอนเปิดแอพรอบหน้า ตรงนี้ไว้ให้ตามตัวได้
  // ถ้าค้างข้ามวันแปลว่าเครื่องเขาน่าจะไม่ได้เปิดแอพ หรือรูปหายไปแล้วจริง
  var pend = A.pendingPhotos || [];
  v.appendChild(section('รูปยังไม่ครบ (' + pend.length + ')', pend.length ? pend.map(function (r) {
    var hrs = hoursSince(r.ts);
    var late = hrs !== null && hrs >= 24;
    return h('div', {
      style: 'display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--color-divider)'
    }, [

      h('span', { class: 'muted', style: 'font-size:12px' },
        ['ขึ้นแล้ว ' + r.photoN + ' ใบ · ' + r.ts]),
      h('span', {
        style: 'font-size:11px;padding:2px 6px;white-space:nowrap;color:var(--color-bg);background:' +
               (late ? 'var(--color-accent)' : 'var(--color-neutral-500)')
      }, [hrs === null ? 'รอรูป' : (hrs < 1 ? 'เพิ่งส่ง' : 'ค้าง ' + hrs + ' ชม.')])
    ]);
  }) : [h('p', { class: 'muted' }, ['รูปครบทุกรายการ'])]));

  var open = P.filter(function (p) { return !p.back; });
  v.appendChild(section('ยังไม่คืน', open.length ? open.map(function (p) {
    return h('div', { style: 'display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--color-divider)' }, [
      h('strong', { style: 'font-size:13px' }, [p.codes || p.id]),
      h('span', { class: 'muted', style: 'font-size:12px' },
        [p.name + ' · ' + p.dept + ' · เบิก ' + p.date + ' ' + (p.out ? p.out.time : '') + ' น.'])
    ]);
  }) : [h('p', { class: 'muted' }, ['คืนครบทุกรายการ'])]));
}

];

var ruleTopic = null;

function viewRules(v) {
  if (!ruleTopic || !A.master.topics.filter(function (t) { return t.id === ruleTopic; }).length) {
    ruleTopic = A.master.topics.length ? A.master.topics[0].id : null;
  }
  if (!ruleTopic) { v.appendChild(h('p', { class: 'muted' }, ['ยังไม่มีหัวข้อ'])); return; }

  v.appendChild(h('div', { class: 'bar' }, A.master.topics.map(function (t) {
    var b = h('button', {
      style: 'padding:8px 14px;font-size:13px;cursor:pointer;font-family:var(--font-heading);font-weight:800;' +
             'background:transparent;color:var(--color-text);border:2px solid ' +
             (t.id === ruleTopic ? 'var(--color-accent)' : 'var(--color-divider)')
    }, [t.name]);
    b.addEventListener('click', function () { ruleTopic = t.id; renderAll(); });
    return b;
  })));

  var T = A.master.topics.filter(function (t) { return t.id === ruleTopic; })[0];

  // — ช่องถ่ายรูป —
  var slots = T.slots.map(function (s) {
    return { th: s.th, en: s.en, req: s.req, onIssue: s.onIssue, hint: s.hint };
  });

  function saveSlots() { saveThen(rpc('apiSaveSlots', A.empId, T.id, slots)); }

  var rows = slots.map(function (sl, i) {
    var reqBtn = h('button', { class: 'chip' + (sl.req && !sl.onIssue ? ' on' : '') },
      [sl.onIssue ? 'เมื่อมีปัญหา' : (sl.req ? 'บังคับ' : 'ไม่บังคับ')]);
    reqBtn.addEventListener('click', function () {
      if (!guardEdit()) return;
      // วน: บังคับ → ไม่บังคับ → เมื่อมีปัญหา
      if (sl.req && !sl.onIssue) { sl.req = false; sl.onIssue = false; }
      else if (!sl.req && !sl.onIssue) { sl.req = true; sl.onIssue = true; }
      else { sl.req = true; sl.onIssue = false; }
      saveSlots();
    });
    var rm = h('button', { class: 'btn btn-secondary', style: 'font-size:12px' }, ['ลบ']);
    rm.addEventListener('click', function () {
      if (!guardEdit()) return;
      slots.splice(i, 1); saveSlots();
    });
    return h('tr', {}, [
      h('td', {}, [String(i + 1)]),
      h('td', { style: 'font-weight:600' }, [sl.th]),
      h('td', { class: 'muted' }, [sl.en]),
      h('td', { style: 'font-size:12px;max-width:320px' }, [sl.hint || '—']),
      h('td', {}, [reqBtn]),
      h('td', {}, [rm])
    ]);
  });

  var nth = h('input', { class: 'input', placeholder: 'ชื่อช่อง (ไทย)', style: 'width:180px' });
  var nen = h('input', { class: 'input', placeholder: 'ชื่อช่อง (EN)', style: 'width:140px' });
  var nhi = h('input', { class: 'input', placeholder: 'คำแนะนำบนจอ', style: 'width:300px' });
  var nadd = h('button', { class: 'btn btn-primary' }, ['เพิ่มช่องถ่าย']);
  nadd.addEventListener('click', function () {
    if (!guardEdit()) return;
    if (!nth.value.trim()) { toast('ต้องมีชื่อช่อง', true); return; }
    slots.push({ th: nth.value.trim(), en: nen.value.trim() || 'Custom', req: true, onIssue: false, hint: nhi.value.trim() });
    saveSlots();
  });

  v.appendChild(section('ช่องถ่ายรูปของ ' + T.name, [
    h('div', { class: 'wrap' }, [h('table', { class: 'table' }, [
      h('thead', {}, [h('tr', {}, ['#', 'ชื่อช่อง (ไทย)', 'EN', 'คำแนะนำบนจอ', 'บังคับ', ''].map(function (t) { return h('th', {}, [t]); }))]),
      h('tbody', {}, rows)
    ])]),
    h('div', { class: 'bar', style: 'margin:14px 0 0' }, [nth, nen, nhi, nadd])
  ]));

  // — เงื่อนไข —
  v.appendChild(section('เงื่อนไขถ่ายรูปของ ' + T.name, RULE_DEFS.map(function (rd) {
    var on = !!T.rules[rd.id];
    var tg = h('button', { class: 'toggle' + (on ? ' on' : '') }, [h('span', {})]);
    tg.addEventListener('click', function () {
      if (!guardEdit()) return;
      saveThen(rpc('apiSetRule', A.empId, T.id, rd.id, rd.name, !on));
    });
    return h('div', {
      style: 'display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--color-divider)'
    }, [
      h('div', { style: 'flex:1' }, [
        h('div', { style: 'font-weight:600;font-size:14px' }, [rd.name]),
        h('div', { class: 'muted', style: 'font-size:12px' }, [rd.desc])
      ]),
      h('span', { style: 'font-size:12px' }, [on ? 'เปิด' : 'ปิด']),
      tg
    ]);
  })));
}

function viewAssets(v) {
  var rows = A.master.assets.map(function (a) {
    var st = h('button', { class: 'chip' + (a.status === 'พร้อมใช้' ? ' on' : '') }, [a.status]);
    st.addEventListener('click', function () {
      if (!guardEdit()) return;
      saveThen(rpc('apiSaveAsset', A.empId, Object.assign({}, a, {
        status: a.status === 'พร้อมใช้' ? 'ซ่อม' : 'พร้อมใช้'
      })));
    });
    var rm = h('button', { class: 'btn btn-secondary', style: 'font-size:12px' }, ['ลบ']);
    rm.addEventListener('click', function () {
      if (!guardEdit()) return;
      if (!confirm('ลบ ' + a.code + ' ออกจากชีท?')) return;
      saveThen(rpc('apiDeleteAsset', A.empId, a.code));
    });
    // อาการค้าง — หน้างานแจ้งมาแล้วค้างไว้จนแอดมินกดเคลียร์ ไม่หายเอง
    var defCell;
    if (a.defect) {
      var clr = h('button', { class: 'btn btn-secondary', style: 'font-size:11px;padding:3px 8px;margin-left:8px' }, ['เคลียร์']);
      clr.addEventListener('click', function () {
        if (!guardEdit()) return;
        if (!confirm('เคลียร์อาการค้างของ ' + a.code + ' ?\n\n' + a.defect +
          '\n\nใช้เมื่อซ่อมเสร็จแล้วหรือแจ้งมาไม่ตรง')) return;
        saveThen(rpc('apiSaveAsset', A.empId, Object.assign({}, a, { defect: '' })));
      });
      // กดที่อาการเพื่อไปดูรูปของเครื่องตัวนั้นในคลังรูปได้เลย
      var see = h('button', { class: 'btn btn-secondary', style: 'font-size:11px;padding:3px 8px;margin-left:8px' },
        ['ดูรูป']);
      see.addEventListener('click', function () { seePhotosOf(a.code); });

      defCell = h('td', { style: 'font-size:12px;max-width:280px;color:var(--color-accent);font-weight:600' },
        [a.defect, see, clr]);
    } else {
      defCell = h('td', { class: 'muted', style: 'font-size:12px' }, ['—']);
    }

    return h('tr', {}, [
      h('td', { style: 'font-family:var(--font-heading);font-weight:800' }, [a.code]),
      h('td', {}, [a.type]), h('td', {}, [a.dept]),
      h('td', {}, [st]),
      defCell,
      h('td', { style: 'font-size:12px' }, [a.note || '—']),
      h('td', {}, [rm])
    ]);
  });

  var nDefect = A.master.assets.filter(function (a) { return a.defect; }).length;
  if (nDefect) {
    v.appendChild(h('div', {
      style: 'border:2px solid var(--color-accent);padding:10px 12px;margin-bottom:14px;font-size:13px'
    }, ['มีเครื่องที่ค้างอาการอยู่ ' + nDefect + ' เครื่อง — ยังเบิกได้ตามปกติ ' +
        'ถ้าใช้ไม่ได้จริงให้กดสถานะเป็น "ซ่อม" เพื่อปิดไม่ให้เบิก · ซ่อมเสร็จแล้วกด "เคลียร์"']));
  }

  v.appendChild(h('div', { class: 'wrap', style: 'margin-bottom:18px' }, [
    h('table', { class: 'table' }, [
      h('thead', {}, [h('tr', {}, ['รหัสเครื่อง', 'ประเภท', 'แผนกประจำ', 'สถานะ', 'อาการค้าง', 'หมายเหตุ', '']
        .map(function (t) { return h('th', {}, [t]); }))]),
      h('tbody', {}, rows)
    ])
  ]));

  var types = A.master.assets.map(function (a) { return a.type; })
    .concat(A.master.topics.map(function (t) { return t.assetType; }))
    .filter(function (x, i, arr) { return x && arr.indexOf(x) === i; });

  var f = {
    code: h('input', { class: 'input', placeholder: 'รหัสเครื่อง', style: 'width:180px' }),
    type: h('select', { class: 'input', style: 'width:auto' }, types.map(function (t) { return h('option', {}, [t]); })),
    dept: h('select', { class: 'input', style: 'width:auto' }, A.master.depts.map(function (d) { return h('option', {}, [d]); })),
    note: h('input', { class: 'input', placeholder: 'หมายเหตุ', style: 'width:260px' })
  };
  var add = h('button', { class: 'btn btn-primary' }, ['เพิ่ม / อัปเดต']);
  add.addEventListener('click', function () {
    if (!guardEdit()) return;
    saveThen(rpc('apiSaveAsset', A.empId, {
      code: f.code.value.trim(), type: f.type.value, dept: f.dept.value,
      status: 'พร้อมใช้', note: f.note.value.trim()
    }));
  });
  v.appendChild(section('เพิ่มเครื่อง (รหัสซ้ำ = แก้ของเดิม)', [
    h('div', { class: 'bar', style: 'margin:0' }, [f.code, f.type, f.dept, f.note, add])
  ]));
}

// ══ เริ่มทำงาน ════════════════════════════════════════════════════════

$('#gate-go').addEventListener('click', gateGo);
$('#gate-pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') gateGo(); });
$('#btn-reload').addEventListener('click', reloadHere);
$('#btn-out').addEventListener('click', function () {
  store.del('adminId'); location.reload();
});

// จำรหัสไว้แล้วก็ข้ามหน้าใส่รหัสไปเลย ไม่ต้องให้เห็นวูบหนึ่งทุกครั้งที่รีเฟรช
if (A.empId) {
  $('#boot').classList.remove('hide');
  bootAuto();
} else {
  showGate();
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* ไม่รองรับก็ใช้งานได้ปกติ */ });
  });
  // เวอร์ชันใหม่มาถึงตอนไหนก็รีเฟรชให้เลย ไม่ต้องปิดแอพเปิดใหม่เอง
  // แต่ห้ามรีตอนกำลังทำงานค้างอยู่ เดี๋ยวรูปที่ถ่ายไว้หาย — รอรอบหน้าแทน
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading) return;
    var cur = document.querySelector('[data-screen]:not(.hide)');
    var at = cur ? cur.getAttribute('data-screen') : '';
    if (at !== 'login' && at !== 'home' && at !== 'queue') return;
    reloading = true;
    location.reload();
  });
}
</script>
